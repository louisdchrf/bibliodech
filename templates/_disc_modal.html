<div id="disc-modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-card" style="max-width:560px">
    <div class="modal-header">
      <h2 class="modal-title" id="disc-modal-title">Disque</h2>
      <button class="modal-close" id="disc-modal-close" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div id="disc-modal-body" style="padding:1.25rem 1.5rem">

      <!-- Couverture + infos principales -->
      <div style="display:flex;gap:1.25rem;margin-bottom:1.25rem">
        <div id="disc-cover-wrap" style="flex-shrink:0;width:120px;height:120px;background:var(--color-surface-2);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div id="disc-info-title" style="font-size:1.1rem;font-weight:700;margin-bottom:.25rem"></div>
          <div id="disc-info-artist" style="font-size:.95rem;color:var(--color-text-muted);margin-bottom:.5rem"></div>
          <div id="disc-info-badges" style="display:flex;gap:.4rem;flex-wrap:wrap"></div>
        </div>
      </div>

      <!-- Détails -->
      <div id="disc-detail-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem .75rem;font-size:.88rem;margin-bottom:1.25rem"></div>

      <!-- Statut enrichissement -->
      <div id="disc-pending-notice" style="display:none;background:var(--color-surface-2);border-radius:6px;padding:.6rem .85rem;font-size:.84rem;color:var(--color-text-muted);margin-bottom:1rem">
        ⏳ Recherche des informations en cours…
      </div>

      <!-- Edit form -->
      <details id="disc-edit-section" style="margin-top:.5rem">
        <summary style="cursor:pointer;font-size:.85rem;color:var(--color-text-muted);user-select:none">Modifier</summary>
        <div style="margin-top:.75rem;display:grid;gap:.6rem">
          <label class="form-label">Titre
            <input class="form-input" id="de-title">
          </label>
          <label class="form-label">Artiste
            <input class="form-input" id="de-artist">
          </label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem">
            <label class="form-label">Format
              <input class="form-input" id="de-format" placeholder="CD, Vinyl…">
            </label>
            <label class="form-label">Année
              <input class="form-input" id="de-year" type="number" min="1900" max="2099">
            </label>
          </div>
          <label class="form-label">Label
            <input class="form-input" id="de-label">
          </label>
          <label class="form-label">Genre
            <input class="form-input" id="de-genre">
          </label>
          <label class="form-label">Localisation
            <select class="form-input" id="de-room">
              <option value="">— Sans —</option>
            </select>
          </label>
          <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.25rem">
            <button class="btn btn-danger-outline" id="disc-btn-delete">Supprimer</button>
            <button class="btn btn-primary" id="disc-btn-save">Enregistrer</button>
          </div>
        </div>
      </details>

    </div>
  </div>
</div>

<script>
(function () {
  const overlay = document.getElementById('disc-modal-overlay');
  let _currentId = null;
  let _pollTimer = null;

  function closeModal() {
    overlay.style.display = 'none';
    if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  }

  document.getElementById('disc-modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  async function loadDisc(id) {
    const r = await fetch(`/api/music/${id}`);
    return r.ok ? r.json() : null;
  }

  window.openDiscModal = async function(id) {
    _currentId = id;
    overlay.style.display = '';

    const disc = await loadDisc(id);
    if (!disc) { closeModal(); return; }
    fillModal(disc);

    if (disc.enrichment_status === 'pending') {
      _pollTimer = setInterval(async () => {
        const updated = await loadDisc(id);
        if (!updated) return;
        if (updated.enrichment_status !== 'pending') {
          clearInterval(_pollTimer); _pollTimer = null;
          fillModal(updated);
        }
      }, 1500);
    }
  };

  function badge(text, color) {
    return `<span style="background:${color};color:#fff;border-radius:4px;padding:.15rem .45rem;font-size:.75rem;font-weight:600">${text}</span>`;
  }

  function fillModal(d) {
    document.getElementById('disc-modal-title').textContent = d.title || 'Disque';
    document.getElementById('disc-info-title').textContent = d.title || '';
    document.getElementById('disc-info-artist').textContent = d.artist || '';

    const coverWrap = document.getElementById('disc-cover-wrap');
    if (d.cover_url) {
      coverWrap.innerHTML = `<img src="${d.cover_url}" style="width:100%;height:100%;object-fit:cover" alt="">`;
    } else {
      coverWrap.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg>`;
    }

    const badges = document.getElementById('disc-info-badges');
    badges.innerHTML = '';
    if (d.format) badges.insertAdjacentHTML('beforeend', badge(d.format, 'var(--color-primary)'));
    if (d.year) badges.insertAdjacentHTML('beforeend', badge(d.year, 'var(--color-text-muted)'));
    if (d.enrichment_status === 'not_found') badges.insertAdjacentHTML('beforeend', badge('Non trouvé', '#e55'));

    const grid = document.getElementById('disc-detail-grid');
    const rows = [
      ['Label', d.label],
      ['N° catalogue', d.catalog_number],
      ['Genre', d.genre],
      ['Pistes', d.track_count],
      ['Pays', d.country],
      ['Langue', d.language],
      ['Localisation', d.room_name],
      ['Code-barres', d.barcode],
    ].filter(([, v]) => v);
    grid.innerHTML = rows.map(([k, v]) =>
      `<div><span style="color:var(--color-text-muted)">${k}</span><br><strong>${v}</strong></div>`
    ).join('');

    document.getElementById('disc-pending-notice').style.display =
      d.enrichment_status === 'pending' ? '' : 'none';

    // Fill edit form
    document.getElementById('de-title').value = d.title || '';
    document.getElementById('de-artist').value = d.artist || '';
    document.getElementById('de-format').value = d.format || '';
    document.getElementById('de-year').value = d.year || '';
    document.getElementById('de-label').value = d.label || '';
    document.getElementById('de-genre').value = d.genre || '';
    document.getElementById('de-room').value = d.room_id || '';
  }

  // Populate room select
  fetch('/api/rooms').then(r => r.json()).then(rooms => {
    const sel = document.getElementById('de-room');
    rooms.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.id;
      opt.textContent = r.name;
      sel.appendChild(opt);
    });
  }).catch(() => {});

  document.getElementById('disc-btn-save').addEventListener('click', async () => {
    const body = {
      title: document.getElementById('de-title').value.trim() || undefined,
      artist: document.getElementById('de-artist').value.trim() || undefined,
      format: document.getElementById('de-format').value.trim() || undefined,
      year: document.getElementById('de-year').value.trim() || undefined,
      label: document.getElementById('de-label').value.trim() || undefined,
      genre: document.getElementById('de-genre').value.trim() || undefined,
      room_id: document.getElementById('de-room').value ? +document.getElementById('de-room').value : null,
    };
    const r = await fetch(`/api/music/${_currentId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (r.ok) {
      const updated = await r.json();
      fillModal(updated);
      window.onDiscSaved?.();
    }
  });

  document.getElementById('disc-btn-delete').addEventListener('click', async () => {
    if (!confirm('Supprimer ce disque ?')) return;
    const r = await fetch(`/api/music/${_currentId}`, { method: 'DELETE' });
    if (r.ok) {
      closeModal();
      window.onDiscDeleted?.();
    }
  });

})();
</script>
