<!-- Modale disque — expose window.openDiscModal(id) -->
<div id="disc-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" id="disc-modal-close" aria-label="Fermer">&times;</button>
    <div id="disc-modal-content"></div>
  </div>
</div>

<script>
(function () {
  const isAdmin = {{ 'true' if user.role == 'admin' else 'false' }};
  const overlay = document.getElementById('disc-modal-overlay');
  const content = document.getElementById('disc-modal-content');
  let _currentDisc = null;
  let _pollTimer = null;
  let _rooms = [];

  // Charger les salles une fois
  fetch('/api/rooms').then(r => r.ok ? r.json() : []).then(r => { _rooms = r; }).catch(() => {});

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function closeModal() {
    overlay.style.display = 'none';
    document.body.classList.remove('modal-open');
    if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  }

  document.getElementById('disc-modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.style.display !== 'none') closeModal(); });

  window.openDiscModal = async function(id) {
    const res = await fetch(`/api/music/${id}`);
    if (!res.ok) return;
    _currentDisc = await res.json();
    renderModal(_currentDisc);
    overlay.style.display = '';
    document.body.classList.add('modal-open');

    if (_currentDisc.enrichment_status === 'pending') {
      _pollTimer = setInterval(async () => {
        const r = await fetch(`/api/music/${id}`);
        if (!r.ok) return;
        const updated = await r.json();
        if (updated.enrichment_status !== 'pending') {
          clearInterval(_pollTimer); _pollTimer = null;
          _currentDisc = updated;
          renderModal(updated);
        }
      }, 1500);
    }
  };

  function renderModal(d) {
    const coverHtml = d.cover_url
      ? `<img src="${escHtml(d.cover_url)}" alt="pochette" class="modal-cover" style="object-fit:cover">`
      : `<div class="modal-cover" style="display:flex;align-items:center;justify-content:center;background:var(--color-surface-2)"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg></div>`;

    const infoRows = [
      ['Label',       d.label],
      ['N° catalogue',d.catalog_number],
      ['Genre',       d.genre],
      ['Pistes',      d.track_count],
      ['Pays',        d.country],
      ['Langue',      d.language],
      ['Localisation',d.room_name],
      ['Code-barres', d.barcode],
    ].filter(([,v]) => v);

    const extLinks = [];
    if (d.mbid)    extLinks.push(`<a href="https://musicbrainz.org/release/${d.mbid}" target="_blank" rel="noopener" class="btn-link" style="font-size:.82rem">MusicBrainz ↗</a>`);
    if (d.barcode) extLinks.push(`<a href="https://www.discogs.com/search/?q=${encodeURIComponent(d.barcode)}&type=release" target="_blank" rel="noopener" class="btn-link" style="font-size:.82rem">Discogs ↗</a>`);

    const roomOptions = _rooms.map(r => `<option value="${r.id}" ${d.room_id == r.id ? 'selected' : ''}>${escHtml(r.name)}</option>`).join('');

    content.innerHTML = `
      <div class="modal-header">
        ${coverHtml}
        <div class="modal-header-info">
          <h2 class="modal-title">${escHtml(d.title)}</h2>
          ${d.artist ? `<p class="modal-authors">${escHtml(d.artist)}</p>` : ''}
          ${d.label  ? `<p class="modal-publisher">${escHtml(d.label)}${d.year ? ' · ' + escHtml(d.year) : ''}</p>` : (d.year ? `<p class="modal-publisher">${escHtml(d.year)}</p>` : '')}
          <div class="modal-badges">
            ${d.format ? `<span class="badge badge-genre">${escHtml(d.format)}</span>` : ''}
            ${d.enrichment_status === 'pending'   ? `<span class="badge" style="background:var(--color-warning,#f59e0b);color:#fff">⏳ En cours…</span>` : ''}
            ${d.enrichment_status === 'not_found' ? `<span class="badge" style="background:var(--color-danger);color:#fff">Non trouvé</span>` : ''}
            ${extLinks.length ? extLinks.join('<span style="color:var(--color-border)"> · </span>') : ''}
          </div>
        </div>
      </div>

      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="info">Infos</button>
        <button class="modal-tab" data-tab="edit">Édition</button>
      </div>

      <!-- Onglet Infos -->
      <div class="modal-tab-panel" id="dm-tab-info">
        ${infoRows.length ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem .75rem;font-size:.88rem;margin-bottom:1rem">
          ${infoRows.map(([k,v]) => `<div><span style="color:var(--color-text-muted)">${k}</span><br><strong>${escHtml(String(v))}</strong></div>`).join('')}
        </div>` : ''}
      </div>

      <!-- Onglet Édition -->
      <div class="modal-tab-panel" id="dm-tab-edit" style="display:none">
        <form id="dm-edit-form" class="edit-form">
          <div class="form-grid">
            <div class="field"><label>Titre</label><input type="text" name="title" value="${escHtml(d.title)}" required></div>
            <div class="field"><label>Artiste</label><input type="text" name="artist" value="${escHtml(d.artist || '')}"></div>
            <div class="field"><label>Label</label><input type="text" name="label" value="${escHtml(d.label || '')}"></div>
            <div class="field"><label>Genre</label><input type="text" name="genre" value="${escHtml(d.genre || '')}"></div>
          </div>
          <div class="form-grid form-grid-2" style="margin-top:.5rem">
            <div class="field"><label>Format</label><input type="text" name="format" value="${escHtml(d.format || '')}" placeholder="CD, Vinyl…"></div>
            <div class="field"><label>Année</label><input type="number" name="year" value="${escHtml(d.year || '')}" min="1900" max="2099"></div>
          </div>
          <div class="field-separator">Localisation</div>
          <div class="field">
            <label>Salle</label>
            <select name="room_id" class="input-full">
              <option value="">— Sans —</option>
              ${roomOptions}
            </select>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            ${isAdmin ? `<button type="button" class="btn btn-danger" id="dm-delete-btn">Supprimer</button>` : ''}
          </div>
          <div id="dm-edit-msg" class="edit-msg"></div>
        </form>
      </div>`;

    // Onglets
    content.querySelectorAll('.modal-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        content.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
        content.querySelectorAll('.modal-tab-panel').forEach(p => p.style.display = 'none');
        tab.classList.add('active');
        document.getElementById('dm-tab-' + tab.dataset.tab).style.display = '';
      });
    });

    // Enregistrer
    document.getElementById('dm-edit-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {
        title:   fd.get('title')  || undefined,
        artist:  fd.get('artist') || undefined,
        label:   fd.get('label')  || undefined,
        genre:   fd.get('genre')  || undefined,
        format:  fd.get('format') || undefined,
        year:    fd.get('year')   || undefined,
        room_id: fd.get('room_id') ? +fd.get('room_id') : null,
      };
      const r = await fetch(`/api/music/${d.id}`, {
        method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
      });
      const msg = document.getElementById('dm-edit-msg');
      if (r.ok) {
        msg.textContent = 'Enregistré !'; msg.className = 'edit-msg edit-msg-ok';
        window.onDiscSaved?.();
        setTimeout(closeModal, 800);
      } else {
        msg.textContent = 'Erreur'; msg.className = 'edit-msg edit-msg-err';
      }
    });

    // Supprimer
    document.getElementById('dm-delete-btn')?.addEventListener('click', async () => {
      if (!confirm('Supprimer ce disque définitivement ?')) return;
      const r = await fetch(`/api/music/${d.id}`, { method: 'DELETE' });
      if (r.ok) { closeModal(); window.onDiscDeleted?.(); }
    });
  }

})();
</script>
