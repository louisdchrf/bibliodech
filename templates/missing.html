{% extends "base.html" %}
{% block title %}À compléter – Bibliodech{% endblock %}

{% block content %}
<div class="missing-page">
  <div class="page-header">
    <h2 class="page-title">À compléter</h2>
    <span id="missing-count" class="book-count"></span>
  </div>

  <div id="missing-loading" class="empty-state">
    <p>Chargement…</p>
  </div>
  <div id="missing-empty" class="empty-state" style="display:none">
    <div class="empty-icon">✅</div>
    <p>Toutes vos séries semblent complètes !</p>
  </div>
  <div id="missing-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function load() {
    const res = await fetch('/api/missing');
    if (!res.ok) {
      document.getElementById('missing-loading').innerHTML = '<p>Erreur de chargement.</p>';
      return;
    }
    const data = await res.json();
    document.getElementById('missing-loading').style.display = 'none';

    if (!data.length) {
      document.getElementById('missing-empty').style.display = 'flex';
      return;
    }

    document.getElementById('missing-count').textContent =
      `${data.length} série${data.length > 1 ? 's' : ''} incomplète${data.length > 1 ? 's' : ''}`;

    const list = document.getElementById('missing-list');
    data.forEach(item => renderSeries(item, list));
  }

  function renderSeries(item, container) {
    const s = item.series;
    const section = document.createElement('div');
    section.className = 'missing-series';
    section.id = `ms-${s.id}`;

    const ownedHtml = item.owned.map(b => `
      <div class="missing-vol missing-vol-owned">
        <span class="missing-vol-pos">${b.position != null ? '#' + b.position : '?'}</span>
        <span class="missing-vol-title">${escHtml(b.title)}</span>
      </div>`).join('');

    const gapsHtml = item.gaps.map(pos => `
      <div class="missing-vol missing-vol-gap" id="gap-${s.id}-${pos}">
        <span class="missing-vol-pos">#${pos}</span>
        <span class="missing-vol-title missing-vol-unknown">Tome manquant</span>
        <button class="btn btn-sm btn-ghost pick-book-btn" data-series-id="${s.id}" data-pos="${pos}" data-slot="gap-${s.id}-${pos}">
          + Assigner un livre
        </button>
      </div>`).join('');

    const candidatesHtml = item.candidates.map(b => `
      <div class="missing-vol missing-vol-candidate" id="cand-${b.id}">
        <span class="missing-vol-pos">${b.series_position != null ? '#' + b.series_position : '?'}</span>
        <div class="missing-vol-body">
          <span class="missing-vol-title">${escHtml(b.title)}</span>
          ${b.current_series_name
            ? `<span class="missing-vol-hint">Actuellement dans "${escHtml(b.current_series_name)}"</span>`
            : `<span class="missing-vol-hint">Non assigné</span>`}
        </div>
        <button class="btn btn-sm btn-primary assign-btn"
          data-book-id="${b.id}" data-series-id="${s.id}" data-pos="${b.series_position ?? ''}">
          Rattacher
        </button>
      </div>`).join('');

    const maxOwned = item.owned.reduce((m, b) => b.position != null ? Math.max(m, b.position) : m, 0);

    const toBuyHtml = item.missing_to_buy.map(m => {
      const isNew = m.position != null && m.position > maxOwned;
      return `
      <div class="missing-vol missing-vol-tobuy" id="tobuy-${m.id}">
        <span class="missing-vol-pos">${m.position != null ? '#' + m.position : '?'}</span>
        <span class="missing-vol-title">${m.title ? escHtml(m.title) : 'Titre inconnu'}</span>
        ${isNew ? '<span class="badge badge-new">Nouvelle sortie</span>' : ''}
        <button class="btn btn-sm btn-ghost pick-book-btn" data-series-id="${s.id}" data-pos="${m.position ?? ''}" data-missing-id="${m.id}" data-slot="tobuy-${m.id}">
          + Assigner un livre
        </button>
        <button class="btn btn-sm btn-ghost resolve-btn" data-missing-id="${m.id}">Acquis ✓</button>
      </div>`;
    }).join('');

    // Ligne "suite non vérifiée" si aucune recherche web n'a été faite
    const hasWebData = item.missing_to_buy.length > 0;
    const uncheckedRow = !hasWebData ? `
      <div class="missing-vol missing-vol-unchecked">
        <span class="missing-vol-pos">…</span>
        <span class="missing-vol-title missing-vol-unknown">Nouvelles sorties non vérifiées</span>
        <button class="btn btn-sm btn-primary search-web-btn" data-series-id="${s.id}">
          🔍 Vérifier en ligne
        </button>
      </div>` : '';

    section.innerHTML = `
      <div class="missing-series-header">
        <h3 class="missing-series-name">${escHtml(s.name)}</h3>
        <span class="badge badge-count">${s.book_count} tome${s.book_count > 1 ? 's' : ''} possédé${s.book_count > 1 ? 's' : ''}</span>
        ${hasWebData ? `<button class="btn btn-ghost btn-sm search-web-btn" data-series-id="${s.id}">🔄 Revérifier</button>` : ''}
        <span class="search-web-status" id="ws-${s.id}"></span>
      </div>

      <div class="missing-vols-grid">
        ${ownedHtml}
        ${gapsHtml}
        ${candidatesHtml}
        ${toBuyHtml}
        ${uncheckedRow}
      </div>
    `;

    container.appendChild(section);
    wireSection(section, s.id);
  }

  function wireSection(section, seriesId) {
    // Rattacher un candidat
    section.querySelectorAll('.assign-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const bookId = btn.dataset.bookId;
        const pos = btn.dataset.pos ? parseFloat(btn.dataset.pos) : null;
        btn.disabled = true;
        const res = await fetch(`/api/books/${bookId}/assign-series`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ series_id: seriesId, position: pos }),
        });
        if (res.ok) {
          const row = document.getElementById(`cand-${bookId}`);
          row.className = 'missing-vol missing-vol-owned';
          row.querySelector('.missing-vol-hint')?.remove();
          btn.remove();
        } else { btn.disabled = false; }
      });
    });

    // Marquer comme acquis
    section.querySelectorAll('.resolve-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const missingId = btn.dataset.missingId;
        btn.disabled = true;
        const res = await fetch(`/api/missing/${missingId}/resolve`, { method: 'POST' });
        if (res.ok) {
          document.getElementById(`tobuy-${missingId}`)?.remove();
        } else { btn.disabled = false; }
      });
    });

    // Picker "Assigner un livre"
    section.querySelectorAll('.pick-book-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const slotId  = btn.dataset.slot;
        const sid     = btn.dataset.seriesId;
        const pos     = btn.dataset.pos;
        const mId     = btn.dataset.missingId || null;
        const slotEl  = document.getElementById(slotId);
        if (!slotEl) return;

        // Éviter d'ouvrir deux fois
        if (slotEl.querySelector('.book-picker')) return;

        const picker = document.createElement('div');
        picker.className = 'book-picker';
        picker.innerHTML = `
          <input class="search-input picker-input" placeholder="Rechercher un titre…" autocomplete="off">
          <div class="picker-results"></div>
          <button class="btn btn-ghost btn-sm picker-cancel">Annuler</button>
        `;
        slotEl.appendChild(picker);

        const input   = picker.querySelector('.picker-input');
        const results = picker.querySelector('.picker-results');
        input.focus();

        picker.querySelector('.picker-cancel').addEventListener('click', () => picker.remove());

        let debounce;
        input.addEventListener('input', () => {
          clearTimeout(debounce);
          debounce = setTimeout(async () => {
            const q = input.value.trim();
            if (q.length < 2) { results.innerHTML = ''; return; }
            const res = await fetch(`/api/books?search=${encodeURIComponent(q)}&limit=10`);
            if (!res.ok) return;
            const data = await res.json();
            results.innerHTML = data.items.length
              ? data.items.map(b => `
                  <div class="picker-item" data-book-id="${b.id}">
                    <span class="picker-item-title">${escHtml(b.title)}</span>
                    <span class="picker-item-author">${escHtml((b.authors || []).join(', '))}</span>
                    ${b.series_name ? `<span class="picker-item-series">${escHtml(b.series_name)}</span>` : ''}
                  </div>`).join('')
              : '<p class="picker-empty">Aucun résultat</p>';

            results.querySelectorAll('.picker-item').forEach(item => {
              item.addEventListener('click', async () => {
                const bookId = item.dataset.bookId;
                const body = { series_id: Number(sid) };
                if (pos) body.position = parseFloat(pos);

                const r = await fetch(`/api/books/${bookId}/assign-series`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                });
                if (r.ok) {
                  // Résoudre le manquant stocké si applicable
                  if (mId) await fetch(`/api/missing/${mId}/resolve`, { method: 'POST' });
                  // Transformer la ligne en "possédé"
                  slotEl.className = 'missing-vol missing-vol-owned';
                  slotEl.innerHTML = `
                    <span class="missing-vol-pos">${pos ? '#' + pos : '?'}</span>
                    <span class="missing-vol-title">${escHtml(item.querySelector('.picker-item-title').textContent)}</span>
                  `;
                }
              });
            });
          }, 250);
        });
      });
    });

    // Recherche web
    section.querySelectorAll('.search-web-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const sid = btn.dataset.seriesId;
        const statusEl = document.getElementById(`ws-${sid}`);
        btn.disabled = true;
        btn.textContent = '⏳';
        statusEl.textContent = 'Recherche…';

        const res = await fetch(`/api/missing/${sid}/search-web`, { method: 'POST' });
        btn.disabled = false;
        btn.textContent = '🔍 Chercher en ligne';

        if (!res.ok) { statusEl.textContent = 'Erreur'; return; }
        const data = await res.json();
        if (data.missing_added.length) {
          statusEl.textContent = `${data.missing_added.length} tome${data.missing_added.length > 1 ? 's' : ''} manquant${data.missing_added.length > 1 ? 's' : ''} trouvé${data.missing_added.length > 1 ? 's' : ''}`;
          // Recharger la section
          const sectionEl = document.getElementById(`ms-${sid}`);
          const newRes = await fetch(`/api/missing/${sid}`);
          if (newRes.ok) {
            const newData = await newRes.json();
            sectionEl.remove();
            const list = document.getElementById('missing-list');
            renderSeries(newData, list);
          }
        } else {
          statusEl.textContent = data.found_positions.length
            ? 'Série complète selon les sources en ligne'
            : 'Aucune information trouvée';
        }
      });
    });
  }

  load();
})();
</script>
{% endblock %}
