{% extends "base.html" %}
{% block title %}Bibliothèque – Bibliodech{% endblock %}

{% block content %}
<div class="library-page">
  <div class="library-toolbar">
    <input type="text" id="search" placeholder="Rechercher titre, auteur, ISBN…" class="search-input">
    <div class="filter-row">
      <select id="filter-location" class="select-input">
        <option value="">Toutes les localisations</option>
        <option value="none">— Sans localisation</option>
      </select>
      <select id="filter-series" class="select-input">
        <option value="">Toutes les séries</option>
        <option value="none">— Sans série</option>
        <option value="any">— Avec série</option>
      </select>
      <select id="filter-cover" class="select-input">
        <option value="">Toutes les couvertures</option>
        <option value="no">— Sans couverture</option>
        <option value="yes">— Avec couverture</option>
      </select>
      <select id="filter-genre" class="select-input">
        <option value="">Tous les genres</option>
        <option value="none">— Sans genre</option>
      </select>
      <select id="filter-source" class="select-input">
        <option value="">Toutes les sources</option>
      </select>
      <select id="sort-by" class="select-input">
        <option value="title">Trier par titre</option>
        <option value="author">Trier par auteur</option>
        <option value="added_at">Trier par date d'ajout</option>
      </select>
      <button id="btn-reenrich" class="btn btn-ghost" title="Relancer la recherche pour les livres non trouvés">🔄 <span id="reenrich-label">Compléter</span></button>
      <button id="btn-reenrich-all" class="btn btn-ghost" title="Recharger les infos de tous les livres depuis les sources">♻️ Tout recharger</button>
      <button id="btn-view-toggle" class="btn btn-ghost btn-icon" title="Changer l'affichage" aria-label="Vue liste / grille">
        <svg id="icon-grid" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <svg id="icon-list" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-select" class="btn btn-ghost">Sélectionner</button>
    </div>
  </div>

  <div id="book-count" class="book-count"></div>
  <div id="book-grid" class="book-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <div class="empty-icon">📚</div>
    <p>Aucun livre trouvé</p>
  </div>
</div>

<!-- Barre d'actions sélection -->
<div id="bulk-bar" class="bulk-bar" style="display:none">
  <span id="bulk-count" class="bulk-count"></span>
  <div class="bulk-actions">
    <button class="btn btn-ghost btn-sm" id="bulk-select-all">Tout sélectionner</button>
    <button class="btn btn-ghost btn-sm" id="bulk-authors">Modifier auteurs</button>
<button class="btn btn-ghost btn-sm" id="bulk-location">Localisation</button>
    <button class="btn btn-ghost btn-sm" id="bulk-reenrich">🔄 Recharger</button>
    {% if user.role == 'admin' %}<button class="btn btn-danger btn-sm" id="bulk-delete">Supprimer</button>{% endif %}
    <button class="btn btn-ghost btn-sm" id="bulk-cancel">Annuler</button>
  </div>
</div>

<!-- Modal bulk (auteurs, localisation) -->
<div id="bulk-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" id="bulk-modal-close" aria-label="Fermer">&times;</button>
    <div id="bulk-modal-content"></div>
  </div>
</div>

{% include "_book_modal.html" %}
{% endblock %}

{% block scripts %}
<script>
(function () {
  const grid = document.getElementById('book-grid');
  const emptyState = document.getElementById('empty-state');
  const bookCount = document.getElementById('book-count');
  const searchInput = document.getElementById('search');
  const filterLocation = document.getElementById('filter-location');
  const filterSeries = document.getElementById('filter-series');
  const filterCover = document.getElementById('filter-cover');
  const filterGenre = document.getElementById('filter-genre');
  const filterSource = document.getElementById('filter-source');
  const sortBy = document.getElementById('sort-by');
  const modalOverlay = document.getElementById('bulk-modal-overlay');
  const modalContent = document.getElementById('bulk-modal-content');
  const modalClose = document.getElementById('bulk-modal-close');
  const btnSelect = document.getElementById('btn-select');
  const bulkBar = document.getElementById('bulk-bar');
  const bulkCount = document.getElementById('bulk-count');

  let debounceTimer;
  let allLocations = [];
  let locTree = [];
  let selectionMode = false;
  let selectedIds = new Set();

  function getPref(key, def) {
    const v = localStorage.getItem(key);
    return v === null ? def : v === '1';
  }
  const isAdmin = {{ 'true' if user.role == 'admin' else 'false' }};

  // ── Vue grille / liste ────────────────────────────────────────────────────
  let listView = localStorage.getItem('bib_list_view') === '1';
  const btnViewToggle = document.getElementById('btn-view-toggle');
  const iconGrid = document.getElementById('icon-grid');
  const iconList = document.getElementById('icon-list');

  function applyViewMode() {
    grid.classList.toggle('list-view', listView);
    iconGrid.style.display = listView ? '' : 'none';
    iconList.style.display = listView ? 'none' : '';
  }
  applyViewMode();

  btnViewToggle.addEventListener('click', () => {
    listView = !listView;
    localStorage.setItem('bib_list_view', listView ? '1' : '0');
    applyViewMode();
  });

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }


  // ── Locations ─────────────────────────────────────────────────────────────
  async function loadLocations() {
    const res = await fetch('/api/locations/tree');
    locTree = await res.json();
    // Filtre : liste plate des étagères avec chemin complet
    const flat = locTree.flatMap(s => s.rooms.map(r => ({
      id: r.id,
      label: s.id ? `${s.name} › ${r.name}` : r.name,
    })));
    filterLocation.innerHTML = '<option value="">Toutes les localisations</option>'
      + '<option value="none">Sans localisation</option>'
      + flat.map(l => `<option value="${l.id}">${escHtml(l.label)}</option>`).join('');
  }

  // ── Books ─────────────────────────────────────────────────────────────────
  async function loadBooks() {
    const params = new URLSearchParams();
    const q = searchInput.value.trim();
    if (q) params.set('search', q);
    const lid = filterLocation.value;
    if (lid) params.set('room_id', lid);
    const src = filterSource.value;
    if (src) params.set('source', src);
    const ser = filterSeries.value;
    if (ser) params.set('series_id', ser);
    const gen = filterGenre.value;
    if (gen) params.set('genre', gen);
    const cov = filterCover.value;
    if (cov) params.set('has_cover', cov);
    params.set('sort_by', sortBy.value);
    params.set('limit', '1000');  // pagination : suffisant pour une biblio personnelle
    const res = await fetch('/api/books?' + params.toString());
    const data = await res.json();
    const books = data.items ?? data;  // rétrocompat si jamais
    renderGrid(books, data.total ?? books.length);
  }

  function renderGrid(books, total) {
    grid.innerHTML = '';
    const n = total ?? books.length;
    bookCount.textContent = n === 0 ? '' : `${n} livre${n > 1 ? 's' : ''}`;
    emptyState.style.display = books.length === 0 ? 'flex' : 'none';
    books.forEach(book => grid.appendChild(bookCardEl(book)));
  }

  function bookCardEl(book) {
    const authors = Array.isArray(book.authors) ? book.authors.join(', ') : '';
    const div = document.createElement('div');
    div.className = 'book-card';
    div.dataset.id = book.id;
    if (selectionMode && selectedIds.has(book.id)) div.classList.add('selected');
    const coverSrc = book.cover_url || '/static/img/no-cover.svg';
    div.innerHTML = `
      <div class="book-select-check" aria-hidden="true"></div>
      <div class="book-cover-wrap">
        <img src="${escHtml(coverSrc)}" alt="couverture" class="book-cover" loading="lazy" onerror="this.src='/static/img/no-cover.svg'">
      </div>
      <div class="book-meta">
        <div class="book-title" title="${escHtml(book.title)}">${escHtml(book.title)}</div>
        ${authors ? `<div class="book-author">${escHtml(authors)}</div>` : ''}
        <div class="book-badges">
          ${book.location && getPref('bib_badge_location', true) ? `<span class="badge badge-shelf">${escHtml(book.location.label)}</span>` : ''}
          ${book.series_name && getPref('bib_badge_series', true) ? `<span class="badge badge-series">${escHtml(book.series_name)}${book.series_position != null ? ` · T.${book.series_position}` : ''}</span>` : ''}
          ${book.active_loan ? `<span class="badge badge-loan${book.active_loan.overdue ? ' badge-loan-overdue' : ''}">Prêté · ${escHtml(book.active_loan.borrower_name||'')}</span>` : ''}
        </div>
      </div>
    `;
    div.addEventListener('click', () => {
      if (selectionMode) toggleSelect(book.id, div);
      else openBookModal(book.id);
    });
    return div;
  }

  // ── Selection mode ────────────────────────────────────────────────────────
  function enterSelectionMode() {
    selectionMode = true;
    selectedIds.clear();
    btnSelect.textContent = 'Annuler';
    btnSelect.classList.add('btn-primary');
    bulkBar.style.display = 'flex';
    grid.classList.add('selection-mode');
    updateBulkCount();
  }

  function exitSelectionMode() {
    selectionMode = false;
    selectedIds.clear();
    btnSelect.textContent = 'Sélectionner';
    btnSelect.classList.remove('btn-primary');
    bulkBar.style.display = 'none';
    grid.classList.remove('selection-mode');
    grid.querySelectorAll('.book-card.selected').forEach(c => c.classList.remove('selected'));
  }

  function toggleSelect(id, card) {
    if (selectedIds.has(id)) {
      selectedIds.delete(id);
      card.classList.remove('selected');
    } else {
      selectedIds.add(id);
      card.classList.add('selected');
    }
    updateBulkCount();
  }

  function updateBulkCount() {
    const n = selectedIds.size;
    bulkCount.textContent = n === 0 ? 'Aucun sélectionné' : `${n} sélectionné${n > 1 ? 's' : ''}`;
  }

  btnSelect.addEventListener('click', () => {
    if (selectionMode) exitSelectionMode();
    else enterSelectionMode();
  });

  document.getElementById('bulk-cancel').addEventListener('click', exitSelectionMode);

  document.getElementById('bulk-select-all').addEventListener('click', () => {
    const cards = grid.querySelectorAll('.book-card');
    cards.forEach(card => {
      const id = parseInt(card.dataset.id);
      selectedIds.add(id);
      card.classList.add('selected');
    });
    updateBulkCount();
  });

  // ── Bulk actions ──────────────────────────────────────────────────────────
  document.getElementById('bulk-authors').addEventListener('click', () => {
    if (!selectedIds.size) return;
    openBulkModal('authors');
  });

  document.getElementById('bulk-location').addEventListener('click', () => {
    if (!selectedIds.size) return;
    openBulkModal('location');
  });

  document.getElementById('bulk-reenrich').addEventListener('click', async () => {
    if (!selectedIds.size) return;
    const ids = [...selectedIds];
    const n = ids.length;
    if (!confirm(`Recharger les infos de ${n} livre${n > 1 ? 's' : ''} depuis toutes les sources ?`)) return;
    const btn = document.getElementById('bulk-reenrich');
    btn.disabled = true;
    btn.textContent = `⏳ 0 / ${n}`;

    // Passer en pending puis relancer chaque livre
    await Promise.all(ids.map(id =>
      fetch(`/api/books/${id}/re-enrich`, { method: 'POST' }).catch(() => null)
    ));

    let pending = new Set(ids);
    let done = 0;
    const poll = setInterval(async () => {
      const checks = [...pending].map(id =>
        fetch(`/api/scan/status/${id}`).then(r => r.json()).catch(() => null)
      );
      const results = await Promise.all(checks);
      const pids = [...pending];
      results.forEach((d, i) => {
        if (!d) return;
        if (d.enrichment_status === 'ok' || d.enrichment_status === 'not_found') {
          pending.delete(pids[i]);
          done++;
        }
      });
      btn.textContent = `⏳ ${done} / ${n}`;
      if (pending.size === 0) {
        clearInterval(poll);
        loadBooks();
        btn.disabled = false;
        btn.textContent = '🔄 Recharger';
      }
    }, 2000);
  });

  const deleteBtn = document.getElementById('bulk-delete');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', async () => {
      if (!selectedIds.size) return;
      const n = selectedIds.size;
      if (!confirm(`Supprimer ${n} livre${n > 1 ? 's' : ''} définitivement ?`)) return;
      const res = await fetch('/api/books/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...selectedIds], action: 'delete' }),
      });
      if (res.ok) { exitSelectionMode(); loadBooks(); }
      else alert('Erreur lors de la suppression.');
    });
  }

  function openBulkModal(type) {
    const n = selectedIds.size;

    if (type === 'authors') {
      modalContent.innerHTML = `
        <h2>Modifier les auteurs</h2>
        <p class="modal-subtitle">${n} livre${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}</p>
        <form id="bulk-form" class="edit-form">
          <div class="field">
            <label>Auteurs (séparés par virgule)</label>
            <input type="text" name="authors" placeholder="Prénom Nom, Prénom Nom…" autofocus>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Appliquer</button>
          </div>
        </form>`;
    } else if (type === 'location') {
      modalContent.innerHTML = `
        <h2>Changer la localisation</h2>
        <p class="modal-subtitle">${n} livre${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}</p>
        <form id="bulk-form" class="edit-form">
          <div class="field">
            <label>Adresse</label>
            <select id="bulk-loc-site" class="input-full">
              <option value="">— Choisir —</option>
              ${locTree.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Pièce</label>
            <select id="bulk-loc-room" class="input-full" disabled>
              <option value="">— Choisir —</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Appliquer</button>
          </div>
        </form>`;

      const bSite = document.getElementById('bulk-loc-site');
      const bRoom = document.getElementById('bulk-loc-room');

      bSite.addEventListener('change', () => {
        const site = locTree.find(s => s.id == bSite.value);
        bRoom.innerHTML = '<option value="">— Choisir —</option>'
          + (site ? site.rooms.map(r => `<option value="${r.id}">${escHtml(r.name)}</option>`).join('') : '');
        bRoom.disabled = !site || !site.rooms.length;
      });
    }

    document.getElementById('bulk-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      let data = {};

      if (type === 'authors') {
        const raw = fd.get('authors') || '';
        data.authors = raw.split(',').map(a => a.trim()).filter(Boolean);
      } else if (type === 'location') {
        const roomId = document.getElementById('bulk-loc-room')?.value;
        data.room_id = roomId ? parseInt(roomId) : null;
      }

      const res = await fetch('/api/books/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...selectedIds], action: 'update', data }),
      });
      if (res.ok) { closeBulkModal(); exitSelectionMode(); loadBooks(); }
      else alert('Erreur lors de la mise à jour.');
    });

    modalOverlay.style.display = 'flex';
    document.body.classList.add('modal-open');
  }

  function closeBulkModal() {
    modalOverlay.style.display = 'none';
    document.body.classList.remove('modal-open');
  }

  // ── Modal livre (délégué à _book_modal.html via openBookModal) ─────────────
  // Callbacks après sauvegarde/suppression
  window.onBookModalSaved = () => { loadBooks(); updateReenrichCount(); };
  window.onBookModalDeleted = () => loadBooks();

  modalClose.addEventListener("click", closeBulkModal);
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeBulkModal(); });

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadBooks, 300);
  });
  filterLocation.addEventListener('change', loadBooks);
  filterSeries.addEventListener('change', loadBooks);
  filterCover.addEventListener('change', loadBooks);
  filterGenre.addEventListener('change', loadBooks);
  filterSource.addEventListener('change', loadBooks);
  sortBy.addEventListener('change', loadBooks);

  // ── Re-enrichissement ────────────────────────────────────────────────────
  const btnReenrich = document.getElementById('btn-reenrich');
  const reenrichLabel = document.getElementById('reenrich-label');

  async function updateReenrichCount() {
    const res = await fetch('/api/books?sort_by=title&limit=1000');
    const data = await res.json();
    const books = data.items ?? data;
    const count = books.filter(b => b.enrichment_status === 'not_found' || (b.isbn && b.title === b.isbn)).length;
    reenrichLabel.textContent = count > 0 ? `Compléter (${count})` : 'Compléter';
    btnReenrich.style.display = count > 0 ? 'inline-flex' : 'none';
  }

  btnReenrich.addEventListener('click', async () => {
    if (!confirm('Relancer la recherche pour tous les livres non trouvés ?')) return;
    btnReenrich.disabled = true;
    reenrichLabel.textContent = 'En cours…';
    const res = await fetch('/api/books/re-enrich-all', { method: 'POST' });
    if (!res.ok) { reenrichLabel.textContent = 'Compléter'; btnReenrich.disabled = false; return; }
    const data = await res.json();
    if (!data.queued) { reenrichLabel.textContent = 'Compléter'; btnReenrich.disabled = false; return; }

    let pending = new Set(data.book_ids);
    let done = 0;
    reenrichLabel.textContent = `0 / ${data.queued}`;

    const pollAll = setInterval(async () => {
      const checks = [...pending].map(id =>
        fetch(`/api/scan/status/${id}`).then(r => r.json()).catch(() => null)
      );
      const results = await Promise.all(checks);
      const ids = [...pending];
      results.forEach((d, i) => {
        if (!d) return;
        if (d.enrichment_status === 'ok' || d.enrichment_status === 'not_found') {
          pending.delete(ids[i]);
          done++;
        }
      });
      reenrichLabel.textContent = `${done} / ${data.queued}`;
      if (pending.size === 0) {
        clearInterval(pollAll);
        loadBooks();
        updateReenrichCount();
        btnReenrich.disabled = false;
      }
    }, 2000);
  });

  const btnReenrichAll = document.getElementById('btn-reenrich-all');
  btnReenrichAll.addEventListener('click', async () => {
    const total = (await fetch('/api/books?limit=1').then(r => r.json()).catch(() => ({total:0}))).total || '?';
    if (!confirm(`Recharger les infos de TOUS les livres (${total}) depuis les sources ?\n\nCela peut prendre plusieurs minutes.`)) return;
    btnReenrichAll.disabled = true;
    btnReenrichAll.textContent = '⏳ 0 / …';
    const res = await fetch('/api/books/re-enrich-all?force=true', { method: 'POST' });
    if (!res.ok) { btnReenrichAll.disabled = false; btnReenrichAll.textContent = '♻️ Tout recharger'; return; }
    const data = await res.json();
    if (!data.queued) { btnReenrichAll.disabled = false; btnReenrichAll.textContent = '♻️ Tout recharger'; return; }

    let pending = new Set(data.book_ids);
    let done = 0;
    btnReenrichAll.textContent = `⏳ 0 / ${data.queued}`;

    const pollAll = setInterval(async () => {
      const ids = [...pending];
      const results = await Promise.all(ids.map(id =>
        fetch(`/api/scan/status/${id}`).then(r => r.json()).catch(() => null)
      ));
      results.forEach((d, i) => {
        if (!d) return;
        if (d.enrichment_status === 'ok' || d.enrichment_status === 'not_found') {
          pending.delete(ids[i]);
          done++;
        }
      });
      btnReenrichAll.textContent = `⏳ ${done} / ${data.queued}`;
      if (pending.size === 0) {
        clearInterval(pollAll);
        loadBooks();
        updateReenrichCount();
        btnReenrichAll.disabled = false;
        btnReenrichAll.textContent = '♻️ Tout recharger';
      }
    }, 3000);
  });

  async function loadSourceFilter() {
    const res = await fetch('/api/books/sources');
    if (!res.ok) return;
    const sources = await res.json();
    if (sources.length <= 1) return;
    filterSource.innerHTML = '<option value="">Toutes les sources</option>'
      + sources.map(s => `<option value="${s.id}">${escHtml(s.label)} (${s.count})</option>`).join('');
  }

  async function loadSeriesFilter() {
    const res = await fetch('/api/series');
    if (!res.ok) return;
    const series = await res.json();
    filterSeries.innerHTML = '<option value="">Toutes les séries</option>'
      + '<option value="none">— Sans série</option>'
      + '<option value="any">— Avec série</option>'
      + series.map(s => `<option value="${s.id}">${escHtml(s.name)} (${s.book_count})</option>`).join('');
  }

  async function loadGenreFilter() {
    const res = await fetch('/api/books/genres');
    if (!res.ok) return;
    const genres = await res.json();
    if (!genres.length) return;
    filterGenre.innerHTML = '<option value="">Tous les genres</option>'
      + '<option value="none">— Sans genre</option>'
      + genres.map(g => `<option value="${escHtml(g.id)}">${escHtml(g.id)} (${g.count})</option>`).join('');
  }

  Promise.all([loadLocations(), loadSourceFilter(), loadSeriesFilter(), loadGenreFilter()]).then(async () => {
    // Appliquer les salles en écriture comme filtre par défaut
    if (!filterLocation.value) {
      const meRes = await fetch('/api/me');
      if (meRes.ok) {
        const me = await meRes.json();
        if (me.write_room_ids && me.write_room_ids.length) {
          // Option spéciale "mes-salles" ou valeur csv si plusieurs
          if (me.write_room_ids.length === 1) {
            filterLocation.value = String(me.write_room_ids[0]);
          } else {
            // Ajouter une option "Mes salles" dynamique si absente
            const val = me.write_room_ids.join(',');
            if (!filterLocation.querySelector(`option[value="${val}"]`)) {
              const opt = document.createElement('option');
              opt.value = val;
              opt.textContent = 'Mes salles';
              filterLocation.insertBefore(opt, filterLocation.options[1]);
            }
            filterLocation.value = val;
          }
        }
      }
    }
    await loadBooks();
    updateReenrichCount();
    // Ouvrir directement un livre si ?book=ID dans l'URL
    const bookId = new URLSearchParams(window.location.search).get('book');
    if (bookId) openBookModal(parseInt(bookId));
  });

  // Rechargement des localisations si on revient sur l'onglet après en avoir créé une
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadLocations();
  });
})();
</script>
{% endblock %}
