{% extends "base.html" %}
{% block title %}Bibliothèque – Bibliodech{% endblock %}

{% block content %}
<div class="library-page">
  <!-- Barre de recherche + actions -->
  <div class="toolbar-top">
    <div class="toolbar-search-wrap">
      <input type="text" id="search" placeholder="Rechercher titre, auteur, ISBN…" class="toolbar-search-input">
    </div>
    <div class="toolbar-actions">
      <select id="sort-by" class="toolbar-sort">
        <option value="title">Titre</option>
        <option value="author">Auteur</option>
        <option value="added_at">Date d'ajout</option>
      </select>
      <button id="btn-view-toggle" class="toolbar-icon-btn" title="Changer l'affichage" aria-label="Vue liste / grille">
        <svg id="icon-grid" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <svg id="icon-list" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
      </button>
      <button id="btn-select" class="toolbar-text-btn" title="Mode sélection">Sélectionner</button>
      <div class="toolbar-more-wrap">
        <button class="toolbar-icon-btn" id="btn-more-actions" title="Plus d'actions">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <div class="toolbar-more-drop" id="more-actions-drop" style="display:none">
          <button class="toolbar-more-item" id="btn-reenrich">🔄 <span id="reenrich-label">Compléter</span></button>
          <button class="toolbar-more-item" id="btn-reenrich-all">♻️ Tout recharger</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bloc filtres -->
  <div class="filter-block" id="filter-block">
    <div class="filter-module" id="fg-location">
      <button class="filter-module-label" data-panel="fp-location">Localisation<span class="filter-module-badge" id="badge-location"></span></button>
      <div class="filter-module-panel" id="fp-location">
        <div class="fp-chips">
          <button class="filter-chip loc-chip active" data-val="">Toute</button>
          <button class="filter-chip loc-chip" data-val="none">Sans</button>
        </div>
        <div class="fp-list" id="msel-location-drop"></div>
      </div>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-module" id="fg-series">
      <button class="filter-module-label" data-panel="fp-series">Série<span class="filter-module-badge" id="badge-series"></span></button>
      <div class="filter-module-panel" id="fp-series">
        <div class="fp-chips">
          <button class="filter-chip series-chip active" data-val="">Toutes</button>
          <button class="filter-chip series-chip" data-val="none">Sans</button>
          <button class="filter-chip series-chip" data-val="any">Avec</button>
        </div>
        <div class="fp-list" id="msel-series-drop"></div>
      </div>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-module" id="fg-cover">
      <button class="filter-module-label" data-panel="fp-cover">Couverture<span class="filter-module-badge" id="badge-cover"></span></button>
      <div class="filter-module-panel" id="fp-cover">
        <div class="fp-chips">
          <button class="filter-chip cover-chip active" data-val="">Toutes</button>
          <button class="filter-chip cover-chip" data-val="yes">Avec</button>
          <button class="filter-chip cover-chip" data-val="no">Sans</button>
        </div>
      </div>
      <select id="filter-cover" style="display:none"></select>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-module" id="fg-genre">
      <button class="filter-module-label" data-panel="fp-genre">Genre<span class="filter-module-badge" id="badge-genre"></span></button>
      <div class="filter-module-panel" id="fp-genre">
        <div class="fp-chips">
          <button class="filter-chip genre-chip active" data-val="">Tous</button>
          <button class="filter-chip genre-chip" data-val="none">Sans</button>
        </div>
        <div class="fp-list" id="msel-genre-drop"></div>
      </div>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-module" id="fg-source">
      <button class="filter-module-label" data-panel="fp-source">Source<span class="filter-module-badge" id="badge-source"></span></button>
      <div class="filter-module-panel" id="fp-source">
        <div class="fp-chips">
          <button class="filter-chip source-chip active" data-val="">Toutes</button>
        </div>
        <div class="fp-list" id="msel-source-drop"></div>
      </div>
    </div>
    <button class="filter-reset" id="btn-filter-reset" style="display:none" title="Effacer les filtres">✕ Réinitialiser</button>
  </div>

  <div id="book-count" class="book-count"></div>
  <div id="book-grid" class="book-grid"></div>
  <div id="empty-state" class="empty-state" style="display:none">
    <div class="empty-icon">📚</div>
    <p>Aucun livre trouvé</p>
  </div>
</div>

<!-- Barre d'actions sélection -->
<div id="bulk-bar" class="bulk-bar" style="display:none">
  <span id="bulk-count" class="bulk-count"></span>
  <div class="bulk-actions">
    <button class="btn btn-ghost btn-sm" id="bulk-select-all">Tout sélectionner</button>
    <button class="btn btn-ghost btn-sm" id="bulk-authors">Modifier auteurs</button>
<button class="btn btn-ghost btn-sm" id="bulk-location">Localisation</button>
    <button class="btn btn-ghost btn-sm" id="bulk-reenrich">🔄 Recharger</button>
    {% if user.role == 'admin' %}<button class="btn btn-danger btn-sm" id="bulk-delete">Supprimer</button>{% endif %}
    <button class="btn btn-ghost btn-sm" id="bulk-cancel">Annuler</button>
  </div>
</div>

<!-- Modal sélection de sources pour Recharger -->
<div id="sources-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-card" style="max-width:420px">
    <button class="modal-close" id="sources-modal-close" aria-label="Fermer">&times;</button>
    <h2 id="sources-modal-title">Recharger depuis…</h2>
    <p class="modal-subtitle" id="sources-modal-subtitle"></p>
    <div id="sources-modal-list" style="display:flex;flex-direction:column;gap:.5rem;margin:1rem 0"></div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem">
      <button class="btn btn-ghost" id="sources-modal-all">Tout sélectionner</button>
      <button class="btn btn-primary" id="sources-modal-confirm">Recharger</button>
    </div>
  </div>
</div>

<!-- Modal bulk (auteurs, localisation) -->
<div id="bulk-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" id="bulk-modal-close" aria-label="Fermer">&times;</button>
    <div id="bulk-modal-content"></div>
  </div>
</div>

{% include "_book_modal.html" %}
{% endblock %}

{% block scripts %}
<script>
(function () {
  const grid = document.getElementById('book-grid');
  const emptyState = document.getElementById('empty-state');
  const bookCount = document.getElementById('book-count');
  const searchInput = document.getElementById('search');
  // filterCover est initialisé après les msel (filterCoverHidden)

  // ── Système de filtres unifié ─────────────────────────────────────────────
  // Chaque groupe a : chips statiques (mutuellement exclusifs) + optionnellement
  // un dropdown "▾" pour des valeurs dynamiques (checkboxes).
  // getFilterState(group) → { chip: string|null, more: string[] }

  function wireChipGroup(chipClass, onChangeCb) {
    document.querySelectorAll(`.${chipClass}`).forEach(chip => {
      chip.addEventListener('click', () => {
        const group = chip.closest('.filter-module');
        group?.querySelectorAll('.fp-list input[type=checkbox]').forEach(c => c.checked = false);
        document.querySelectorAll(`.${chipClass}`).forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        onChangeCb();
      });
    });
    return () => {
      const active = document.querySelector(`.${chipClass}.active`);
      return active ? active.dataset.val : '';
    };
  }

  function makeInlineList(dropId, onChangeCb) {
    const drop = document.getElementById(dropId);
    if (!drop) return { getValues: () => [], setOptions: () => {}, clear: () => {}, _onchange: () => {} };
    function getValues() {
      return [...drop.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
    }
    function _onchange() {
      const hasChecked = getValues().length > 0;
      if (hasChecked) {
        const group = drop.closest('.filter-module');
        group?.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      }
      onChangeCb();
    }
    function setOptions(opts) {
      drop.querySelectorAll('label').forEach(l => l.remove());
      opts.forEach(o => {
        const lbl = document.createElement('label');
        lbl.className = 'msel-opt';
        lbl.innerHTML = `<input type="checkbox" value="${escHtml(String(o.value))}"> ${escHtml(o.label)}`;
        lbl.querySelector('input').addEventListener('change', _onchange);
        drop.appendChild(lbl);
      });
    }
    function clear() {
      drop.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = false);
    }
    return { getValues, setOptions, clear, _onchange };
  }

  const mselMoreLocation = makeInlineList('msel-location-drop', () => { updateFilterReset(); refreshBadges(); loadBooks(); });
  const mselMoreSeries   = makeInlineList('msel-series-drop',   () => { updateFilterReset(); refreshBadges(); loadBooks(); });
  const mselMoreGenre    = makeInlineList('msel-genre-drop',    () => { updateFilterReset(); refreshBadges(); loadBooks(); });
  const mselMoreSource   = makeInlineList('msel-source-drop',   () => { updateFilterReset(); refreshBadges(); loadBooks(); });

  const getLocChip   = wireChipGroup('loc-chip',    () => { mselMoreLocation.clear(); updateFilterReset(); refreshBadges(); loadBooks(); });
  const getSerChip   = wireChipGroup('series-chip',  () => { mselMoreSeries.clear(); updateFilterReset(); refreshBadges(); loadBooks(); });
  const getCovChip   = wireChipGroup('cover-chip',   () => { updateFilterReset(); refreshBadges(); loadBooks(); });
  const getGenChip   = wireChipGroup('genre-chip',   () => { mselMoreGenre.clear(); updateFilterReset(); refreshBadges(); loadBooks(); });
  const getSrcChip   = wireChipGroup('source-chip',  () => { mselMoreSource.clear(); updateFilterReset(); refreshBadges(); loadBooks(); });

  // ── Accordéon filtres ────────────────────────────────────────────────────
  document.querySelectorAll('.filter-module-label[data-panel]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const panelId = btn.dataset.panel;
      const panel = document.getElementById(panelId);
      const isOpen = panel.classList.contains('open');
      // Fermer tous les panels
      document.querySelectorAll('.filter-module-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.filter-module-label.open').forEach(b => b.classList.remove('open'));
      // Fermer les dropdowns de la toolbar
      document.querySelectorAll('.toolbar-more-drop').forEach(d => d.style.display = 'none');
      if (!isOpen) {
        panel.classList.add('open');
        btn.classList.add('open');
      }
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.filter-module')) {
      document.querySelectorAll('.filter-module-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.filter-module-label.open').forEach(b => b.classList.remove('open'));
    }
  });

  function updateBadge(badgeId, text) {
    const el = document.getElementById(badgeId);
    if (!el) return;
    el.textContent = text ? ` · ${text}` : '';
    el.style.display = text ? '' : 'none';
    const btn = el.closest('.filter-module-label');
    btn?.classList.toggle('has-filter', !!text);
  }

  function refreshBadges() {
    const locMore = mselMoreLocation.getValues();
    const locChip = getLocChip();
    updateBadge('badge-location', locMore.length ? `${locMore.length} sél.` : locChip === 'none' ? 'Sans' : '');
    const serMore = mselMoreSeries.getValues();
    const ser = getSerChip();
    updateBadge('badge-series', serMore.length ? `${serMore.length} sél.` : ser === 'none' ? 'Sans' : ser === 'any' ? 'Avec' : '');
    const cov = getCovChip();
    updateBadge('badge-cover', cov === 'yes' ? 'Avec' : cov === 'no' ? 'Sans' : '');
    const genMore = mselMoreGenre.getValues();
    const genChip = getGenChip();
    updateBadge('badge-genre', genMore.length ? `${genMore.length} sél.` : genChip === 'none' ? 'Sans' : '');
    const srcMore = mselMoreSource.getValues();
    updateBadge('badge-source', srcMore.length ? `${srcMore.length} sél.` : '');
  }

  // ── Bouton reset filtres ──────────────────────────────────────────────────
  const btnFilterReset = document.getElementById('btn-filter-reset');
  function updateFilterReset() {
    const chipActive = cls => { const a = document.querySelector(`.${cls}.active`); return a && a.dataset.val !== ''; };
    const hasFilters = chipActive('loc-chip') || mselMoreLocation.getValues().length
      || chipActive('series-chip') || mselMoreSeries.getValues().length
      || chipActive('cover-chip')
      || chipActive('genre-chip') || mselMoreGenre.getValues().length
      || chipActive('source-chip') || mselMoreSource.getValues().length;
    btnFilterReset.style.display = hasFilters ? 'inline-flex' : 'none';
  }
  btnFilterReset.addEventListener('click', () => {
    ['loc-chip','series-chip','cover-chip','genre-chip','source-chip'].forEach(cls => {
      document.querySelectorAll(`.${cls}`).forEach(c => c.classList.remove('active'));
      document.querySelector(`.${cls}[data-val=""]`)?.classList.add('active');
    });
    [mselMoreLocation, mselMoreSeries, mselMoreGenre, mselMoreSource].forEach(m => m.clear());
    btnFilterReset.style.display = 'none';
    loadBooks();
  });

  // ── Menu "Plus d'actions" ─────────────────────────────────────────────────
  const moreDrop = document.getElementById('more-actions-drop');
  document.getElementById('btn-more-actions').addEventListener('click', e => {
    e.stopPropagation();
    moreDrop.style.display = moreDrop.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.toolbar-more-drop').forEach(d => d.style.display = 'none');
  });

  // ── Modale sélection sources ──────────────────────────────────────────────
  let _sourcesCallback = null;
  const srcModalOverlay = document.getElementById('sources-modal-overlay');
  const srcModalList    = document.getElementById('sources-modal-list');
  const srcModalTitle   = document.getElementById('sources-modal-title');
  const srcModalSub     = document.getElementById('sources-modal-subtitle');
  document.getElementById('sources-modal-close').addEventListener('click', () => srcModalOverlay.style.display = 'none');
  document.getElementById('sources-modal-all').addEventListener('click', () => {
    srcModalList.querySelectorAll('input[type=checkbox]').forEach(c => c.checked = true);
  });
  document.getElementById('sources-modal-confirm').addEventListener('click', () => {
    const selected = [...srcModalList.querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
    srcModalOverlay.style.display = 'none';
    if (_sourcesCallback) _sourcesCallback(selected);
  });

  async function openSourcesModal(title, subtitle, callback) {
    srcModalTitle.textContent = title;
    srcModalSub.textContent = subtitle;
    _sourcesCallback = callback;
    // Charger les sources configurées
    const res = await fetch('/api/settings/sources');
    const sources = res.ok ? await res.json() : [];
    const enabled = sources.filter(s => s.enabled !== false);
    srcModalList.innerHTML = enabled.map(s =>
      `<label style="display:flex;align-items:center;gap:.5rem;cursor:pointer">
        <input type="checkbox" value="${escHtml(s.id)}" checked style="width:1rem;height:1rem">
        <span>${escHtml(s.label || s.id)}</span>
      </label>`
    ).join('') || '<p style="color:var(--color-text-muted)">Aucune source configurée</p>';
    srcModalOverlay.style.display = 'flex';
  }

  const sortBy = document.getElementById('sort-by');
  const modalOverlay = document.getElementById('bulk-modal-overlay');
  const modalContent = document.getElementById('bulk-modal-content');
  const modalClose = document.getElementById('bulk-modal-close');
  const btnSelect = document.getElementById('btn-select');
  const bulkBar = document.getElementById('bulk-bar');
  const bulkCount = document.getElementById('bulk-count');

  let debounceTimer;
  let allLocations = [];
  let locTree = [];
  let selectionMode = false;
  let selectedIds = new Set();

  function getPref(key, def) {
    const v = localStorage.getItem(key);
    return v === null ? def : v === '1';
  }
  const isAdmin = {{ 'true' if user.role == 'admin' else 'false' }};

  // ── Vue grille / liste ────────────────────────────────────────────────────
  let listView = localStorage.getItem('bib_list_view') === '1';
  const btnViewToggle = document.getElementById('btn-view-toggle');
  const iconGrid = document.getElementById('icon-grid');
  const iconList = document.getElementById('icon-list');

  function applyViewMode() {
    grid.classList.toggle('list-view', listView);
    iconGrid.style.display = listView ? '' : 'none';
    iconList.style.display = listView ? 'none' : '';
  }
  applyViewMode();

  btnViewToggle.addEventListener('click', () => {
    listView = !listView;
    localStorage.setItem('bib_list_view', listView ? '1' : '0');
    applyViewMode();
  });


  // ── Locations ─────────────────────────────────────────────────────────────
  async function loadLocations() {
    const res = await fetch('/api/locations/tree');
    locTree = await res.json();
    const drop = document.getElementById('msel-location-drop');
    // Vider le dropdown (garder les labels spéciaux du HTML si nécessaire)
    drop.innerHTML = '';
    locTree.forEach(site => {
      // Adresse = en-tête non-cliquable
      const hdr = document.createElement('div');
      hdr.className = 'fp-list-header';
      hdr.textContent = site.name;
      drop.appendChild(hdr);

      site.rooms.forEach(room => {
        const roomEl = document.createElement('label');
        roomEl.className = 'msel-opt';
        roomEl.innerHTML = `<input type="checkbox" value="${escHtml(String(room.id))}"> ${escHtml(room.name)}`;
        roomEl.querySelector('input').addEventListener('change', () => { mselMoreLocation._onchange(); });
        drop.appendChild(roomEl);
        (room.shelves || []).forEach(shelf => {
          const shelfEl = document.createElement('label');
          shelfEl.className = 'msel-opt msel-opt-shelf';
          shelfEl.innerHTML = `<input type="checkbox" value="shelf:${escHtml(String(shelf.id))}"> ${escHtml(shelf.name)}`;
          shelfEl.querySelector('input').addEventListener('change', () => { mselMoreLocation._onchange(); });
          drop.appendChild(shelfEl);
        });
      });
    });
  }

  // ── Books ─────────────────────────────────────────────────────────────────
  async function loadBooks() {
    const params = new URLSearchParams();
    const q = searchInput.value.trim();
    if (q) params.set('search', q);

    // Localisation : dropdown spécifique en priorité, sinon chip "Sans"
    const locMore = mselMoreLocation.getValues();
    const locChip = getLocChip();
    if (locMore.length) {
      const sites  = locMore.filter(v => v.startsWith('site:')).map(v => v.slice(5));
      const shelves = locMore.filter(v => v.startsWith('shelf:')).map(v => v.slice(6));
      const rooms  = locMore.filter(v => !v.startsWith('site:') && !v.startsWith('shelf:'));
      if (sites.length === 1 && !rooms.length && !shelves.length) params.set('site_id', sites[0]);
      else if (shelves.length === 1 && !rooms.length) params.set('location_id', shelves[0]);
      else if (rooms.length === 1) params.set('room_id', rooms[0]);
    } else if (locChip === 'none') {
      params.set('room_id', 'none');
    }

    // Série
    const serMore = mselMoreSeries.getValues();
    const serChip = getSerChip();
    if (serMore.length) params.set('series_id', serMore[0]);
    else if (serChip === 'none') params.set('series_id', 'none');
    else if (serChip === 'any') params.set('series_id', 'any');

    // Couverture
    const covChip = getCovChip();
    if (covChip) params.set('has_cover', covChip);

    // Genre
    const genMore = mselMoreGenre.getValues();
    const genChip = getGenChip();
    if (genMore.length) params.set('genre', genMore[0]);
    else if (genChip === 'none') params.set('genre', 'none');

    // Source
    const srcMore = mselMoreSource.getValues();
    const srcChip = getSrcChip();
    if (srcMore.length === 1) params.set('source', srcMore[0]);
    else if (srcChip && srcChip !== '') params.set('source', srcChip);
    params.set('sort_by', sortBy.value);
    params.set('limit', '1000');  // pagination : suffisant pour une biblio personnelle
    const res = await fetch('/api/books?' + params.toString());
    const data = await res.json();
    const books = data.items ?? data;  // rétrocompat si jamais
    renderGrid(books, data.total ?? books.length);
  }

  function renderGrid(books, total) {
    grid.innerHTML = '';
    const n = total ?? books.length;
    bookCount.textContent = n === 0 ? '' : `${n} livre${n > 1 ? 's' : ''}`;
    emptyState.style.display = books.length === 0 ? 'flex' : 'none';
    books.forEach(book => grid.appendChild(bookCardEl(book)));
  }

  function bookCardEl(book) {
    const authors = Array.isArray(book.authors) ? book.authors.join(', ') : '';
    const div = document.createElement('div');
    div.className = 'book-card';
    div.dataset.id = book.id;
    if (selectionMode && selectedIds.has(book.id)) div.classList.add('selected');
    const coverSrc = book.cover_url || '/static/img/no-cover.svg';
    div.innerHTML = `
      <div class="book-select-check" aria-hidden="true"></div>
      <div class="book-cover-wrap">
        <img src="${escHtml(coverSrc)}" alt="couverture" class="book-cover" loading="lazy" onerror="this.src='/static/img/no-cover.svg'">
      </div>
      <div class="book-meta">
        <div class="book-title" title="${escHtml(book.title)}">${escHtml(book.title)}</div>
        ${authors ? `<div class="book-author">${escHtml(authors)}</div>` : ''}
        <div class="book-badges">
          ${book.location && getPref('bib_badge_location', true) ? `<span class="badge badge-shelf">${escHtml(book.location.label)}</span>` : ''}
          ${book.series_name && getPref('bib_badge_series', true) ? `<span class="badge badge-series">${escHtml(book.series_name)}${book.series_position != null ? ` · T.${book.series_position}` : ''}</span>` : ''}
          ${book.active_loan ? `<span class="badge badge-loan${book.active_loan.overdue ? ' badge-loan-overdue' : ''}">Prêté · ${escHtml(book.active_loan.borrower_name||'')}</span>` : ''}
        </div>
      </div>
    `;
    div.addEventListener('click', () => {
      if (selectionMode) toggleSelect(book.id, div);
      else openBookModal(book.id);
    });
    return div;
  }

  // ── Selection mode ────────────────────────────────────────────────────────
  function enterSelectionMode() {
    selectionMode = true;
    selectedIds.clear();
    btnSelect.textContent = 'Annuler';
    btnSelect.classList.add('active');
    bulkBar.style.display = 'flex';
    grid.classList.add('selection-mode');
    updateBulkCount();
  }

  function exitSelectionMode() {
    selectionMode = false;
    selectedIds.clear();
    btnSelect.textContent = 'Sélectionner';
    btnSelect.classList.remove('active');
    bulkBar.style.display = 'none';
    grid.classList.remove('selection-mode');
    grid.querySelectorAll('.book-card.selected').forEach(c => c.classList.remove('selected'));
  }

  function toggleSelect(id, card) {
    if (selectedIds.has(id)) {
      selectedIds.delete(id);
      card.classList.remove('selected');
    } else {
      selectedIds.add(id);
      card.classList.add('selected');
    }
    updateBulkCount();
  }

  function updateBulkCount() {
    const n = selectedIds.size;
    bulkCount.textContent = n === 0 ? 'Aucun sélectionné' : `${n} sélectionné${n > 1 ? 's' : ''}`;
  }

  btnSelect.addEventListener('click', () => {
    if (selectionMode) exitSelectionMode();
    else enterSelectionMode();
  });

  document.getElementById('bulk-cancel').addEventListener('click', exitSelectionMode);

  document.getElementById('bulk-select-all').addEventListener('click', () => {
    const cards = grid.querySelectorAll('.book-card');
    cards.forEach(card => {
      const id = parseInt(card.dataset.id);
      selectedIds.add(id);
      card.classList.add('selected');
    });
    updateBulkCount();
  });

  // ── Bulk actions ──────────────────────────────────────────────────────────
  document.getElementById('bulk-authors').addEventListener('click', () => {
    if (!selectedIds.size) return;
    openBulkModal('authors');
  });

  document.getElementById('bulk-location').addEventListener('click', () => {
    if (!selectedIds.size) return;
    openBulkModal('location');
  });

  document.getElementById('bulk-reenrich').addEventListener('click', () => {
    if (!selectedIds.size) return;
    const ids = [...selectedIds];
    const n = ids.length;
    openSourcesModal('Recharger les livres sélectionnés', `Sources à utiliser pour ${n} livre${n > 1 ? 's' : ''} :`, async (selectedSrcs) => {
      const btn = document.getElementById('bulk-reenrich');
      btn.disabled = true;
      btn.textContent = `⏳ 0 / ${n}`;
      const srcParam = selectedSrcs.length ? `?sources=${encodeURIComponent(selectedSrcs.join(','))}` : '';
      await Promise.all(ids.map(id =>
        fetch(`/api/books/${id}/re-enrich${srcParam}`, { method: 'POST' }).catch(() => null)
      ));
      pollReenrich(new Set(ids), n,
        (done, total) => { btn.textContent = `⏳ ${done} / ${total}`; },
        () => { loadBooks(); btn.disabled = false; btn.textContent = '🔄 Recharger'; }
      );
    });
  });

  const deleteBtn = document.getElementById('bulk-delete');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', async () => {
      if (!selectedIds.size) return;
      const n = selectedIds.size;
      if (!confirm(`Supprimer ${n} livre${n > 1 ? 's' : ''} définitivement ?`)) return;
      const res = await fetch('/api/books/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...selectedIds], action: 'delete' }),
      });
      if (res.ok) { exitSelectionMode(); loadBooks(); }
      else alert('Erreur lors de la suppression.');
    });
  }

  function openBulkModal(type) {
    const n = selectedIds.size;

    if (type === 'authors') {
      modalContent.innerHTML = `
        <h2>Modifier les auteurs</h2>
        <p class="modal-subtitle">${n} livre${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}</p>
        <form id="bulk-form" class="edit-form">
          <div class="field">
            <label>Auteurs (séparés par virgule)</label>
            <input type="text" name="authors" placeholder="Prénom Nom, Prénom Nom…" autofocus>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Appliquer</button>
          </div>
        </form>`;
    } else if (type === 'location') {
      modalContent.innerHTML = `
        <h2>Changer la localisation</h2>
        <p class="modal-subtitle">${n} livre${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}</p>
        <form id="bulk-form" class="edit-form">
          <div class="field">
            <label>Adresse</label>
            <select id="bulk-loc-site" class="input-full">
              <option value="">— Choisir —</option>
              ${locTree.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Pièce</label>
            <select id="bulk-loc-room" class="input-full" disabled>
              <option value="">— Choisir —</option>
            </select>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Appliquer</button>
          </div>
        </form>`;

      const bSite = document.getElementById('bulk-loc-site');
      const bRoom = document.getElementById('bulk-loc-room');

      bSite.addEventListener('change', () => {
        const site = locTree.find(s => s.id == bSite.value);
        bRoom.innerHTML = '<option value="">— Choisir —</option>'
          + (site ? site.rooms.map(r => `<option value="${r.id}">${escHtml(r.name)}</option>`).join('') : '');
        bRoom.disabled = !site || !site.rooms.length;
      });
    }

    document.getElementById('bulk-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      let data = {};

      if (type === 'authors') {
        const raw = fd.get('authors') || '';
        data.authors = raw.split(',').map(a => a.trim()).filter(Boolean);
      } else if (type === 'location') {
        const roomId = document.getElementById('bulk-loc-room')?.value;
        data.room_id = roomId ? parseInt(roomId) : null;
      }

      const res = await fetch('/api/books/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: [...selectedIds], action: 'update', data }),
      });
      if (res.ok) { closeBulkModal(); exitSelectionMode(); loadBooks(); }
      else alert('Erreur lors de la mise à jour.');
    });

    modalOverlay.style.display = 'flex';
    document.body.classList.add('modal-open');
  }

  function closeBulkModal() {
    modalOverlay.style.display = 'none';
    document.body.classList.remove('modal-open');
  }

  // ── Modal livre (délégué à _book_modal.html via openBookModal) ─────────────
  // Callbacks après sauvegarde/suppression
  window.onBookModalSaved = () => { loadBooks(); updateReenrichCount(); };
  window.onBookModalDeleted = () => loadBooks();

  modalClose.addEventListener("click", closeBulkModal);
  modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) closeBulkModal(); });

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadBooks, 300);
  });
  // filterCover géré via les cover-chip
  sortBy.addEventListener('change', loadBooks);

  // ── Re-enrichissement ────────────────────────────────────────────────────
  const btnReenrich = document.getElementById('btn-reenrich');
  const reenrichLabel = document.getElementById('reenrich-label');

  async function updateReenrichCount() {
    const res = await fetch('/api/books?sort_by=title&limit=1000');
    const data = await res.json();
    const books = data.items ?? data;
    const count = books.filter(b => b.enrichment_status === 'not_found' || (b.isbn && b.title === b.isbn)).length;
    reenrichLabel.textContent = count > 0 ? `Compléter (${count})` : 'Compléter';
    btnReenrich.style.display = count > 0 ? 'inline-flex' : 'none';
  }

  function pollReenrich(pending, total, onProgress, onDone) {
    let done = 0;
    const iv = setInterval(async () => {
      const ids = [...pending];
      const results = await Promise.all(ids.map(id =>
        fetch(`/api/scan/status/${id}`).then(r => r.json()).catch(() => null)
      ));
      results.forEach((d, i) => {
        if (!d) return;
        if (d.enrichment_status === 'ok' || d.enrichment_status === 'not_found') { pending.delete(ids[i]); done++; }
      });
      onProgress(done, total);
      if (pending.size === 0) { clearInterval(iv); onDone(); }
    }, 2000);
  }

  btnReenrich.addEventListener('click', () => {
    openSourcesModal('Compléter les livres manquants', 'Sources à interroger pour les livres non trouvés :', async (selectedSrcs) => {
      btnReenrich.disabled = true;
      reenrichLabel.textContent = 'En cours…';
      const srcParam = selectedSrcs.length ? `sources=${encodeURIComponent(selectedSrcs.join(','))}` : '';
      const res = await fetch(`/api/books/re-enrich-all?${srcParam}`, { method: 'POST' });
      if (!res.ok) { reenrichLabel.textContent = 'Compléter'; btnReenrich.disabled = false; return; }
      const data = await res.json().catch(() => ({}));
      if (!data.queued) { reenrichLabel.textContent = 'Compléter'; btnReenrich.disabled = false; return; }
      pollReenrich(new Set(data.book_ids), data.queued,
        (done, total) => { reenrichLabel.textContent = `${done} / ${total}`; },
        () => { loadBooks(); updateReenrichCount(); btnReenrich.disabled = false; }
      );
    });
  });

  const btnReenrichAll = document.getElementById('btn-reenrich-all');
  btnReenrichAll.addEventListener('click', async () => {
    const total = (await fetch('/api/books?limit=1').then(r => r.json()).catch(() => ({total:0}))).total || '?';
    openSourcesModal('Tout recharger', `Recharger les infos de TOUS les livres (${total}) depuis les sources sélectionnées :`, async (selectedSrcs) => {
      btnReenrichAll.disabled = true;
      btnReenrichAll.textContent = '⏳ 0 / …';
      const srcParam = selectedSrcs.length ? `&sources=${encodeURIComponent(selectedSrcs.join(','))}` : '';
      const res = await fetch(`/api/books/re-enrich-all?force=true${srcParam}`, { method: 'POST' });
      if (!res.ok) { btnReenrichAll.disabled = false; btnReenrichAll.textContent = '♻️ Tout recharger'; return; }
      const data = await res.json();
      if (!data.queued) { btnReenrichAll.disabled = false; btnReenrichAll.textContent = '♻️ Tout recharger'; return; }
      btnReenrichAll.textContent = `⏳ 0 / ${data.queued}`;
      pollReenrich(new Set(data.book_ids), data.queued,
        (done, t) => { btnReenrichAll.textContent = `⏳ ${done} / ${t}`; },
        () => { loadBooks(); updateReenrichCount(); btnReenrichAll.disabled = false; btnReenrichAll.textContent = '♻️ Tout recharger'; }
      );
    });
  });

  async function loadSourceFilter() {
    const res = await fetch('/api/books/sources');
    if (!res.ok) return;
    const sources = await res.json();
    mselMoreSource.setOptions(sources.map(s => ({ value: s.id, label: `${s.label} (${s.count})` })));
  }

  async function loadGenreFilter() {
    const res = await fetch('/api/books/genres');
    if (!res.ok) return;
    const genres = await res.json();
    mselMoreGenre.setOptions(genres.map(g => ({ value: g.id, label: `${g.id} (${g.count})` })));
  }

  async function loadSeriesFilter() {
    const res = await fetch('/api/series');
    if (!res.ok) return;
    const series = await res.json();
    mselMoreSeries.setOptions(series.map(s => ({ value: s.id, label: `${s.name} (${s.book_count})` })));
  }

  Promise.all([loadLocations(), loadSourceFilter(), loadGenreFilter(), loadSeriesFilter()]).then(async () => {
    // Pré-sélectionner les salles en écriture dans le dropdown localisation
    {
      const meRes = await fetch('/api/me');
      if (meRes.ok) {
        const me = await meRes.json();
        if (me.write_room_ids && me.write_room_ids.length) {
          const ids = me.write_room_ids.map(String);
          document.querySelectorAll('#msel-location-drop input[type=checkbox]').forEach(c => {
            if (ids.includes(c.value)) c.checked = true;
          });
          // Désactiver le chip "Toute" si des salles sont pré-sélectionnées
          if (ids.length) {
            document.querySelectorAll('.loc-chip').forEach(c => c.classList.remove('active'));
            mselMoreLocation._onchange();
          }
        }
      }
    }
    await loadBooks();
    updateReenrichCount();
    // Ouvrir directement un livre si ?book=ID dans l'URL
    const bookId = new URLSearchParams(window.location.search).get('book');
    if (bookId) openBookModal(parseInt(bookId));
  });

  // Rechargement des localisations si on revient sur l'onglet après en avoir créé une
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadLocations();
  });
})();
</script>
{% endblock %}
