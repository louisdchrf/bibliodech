{% extends "base.html" %}
{% block title %}Comptes – Bibliodech{% endblock %}

{% block content %}
<div class="users-page">
  <h2 class="page-title">Gestion des comptes</h2>

  <div class="users-table-wrap">
    <table class="users-table" id="users-table">
      <thead>
        <tr>
          <th>Utilisateur</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Localisation</th>
          <th>Créé le</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>

  <hr class="section-divider">

  <h3 class="page-title">Créer un compte</h3>
  <form id="create-user-form" class="create-user-form">
    <div class="form-grid">
      <div class="field">
        <label for="new-username">Nom d'utilisateur</label>
        <input type="text" id="new-username" name="username" required autocomplete="off">
      </div>
      <div class="field">
        <label for="new-password">Mot de passe</label>
        <input type="password" id="new-password" name="password" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="new-role">Rôle</label>
        <select id="new-role" name="role">
          <option value="contributeur">Contributeur</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Créer</button>
    </div>
    <div id="create-msg" class="edit-msg"></div>
  </form>
</div>

<!-- Edit modal -->
<div id="edit-modal" class="modal-overlay" style="display:none">
  <div class="modal-card modal-card-sm">
    <button class="modal-close" id="edit-modal-close">&times;</button>
    <h3>Modifier l'utilisateur</h3>
    <form id="edit-user-form" class="create-user-form">
      <input type="hidden" id="edit-user-id">
      <div class="field">
        <label>Nom d'utilisateur</label>
        <input type="text" id="edit-username" name="username" required>
      </div>
      <div class="field">
        <label>Nouveau mot de passe (laisser vide pour ne pas changer)</label>
        <input type="password" id="edit-password" name="password" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Rôle</label>
        <select id="edit-role" name="role">
          <option value="contributeur">Contributeur</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="field" id="permissions-field">
        <label>Accès aux localisations</label>
        <div id="edit-permissions-list" style="display:flex;flex-direction:column;gap:.4rem;margin-top:.35rem"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
      <div id="edit-user-msg" class="edit-msg"></div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('fr-FR');
  }

  const tbody = document.getElementById('users-tbody');
  const createForm = document.getElementById('create-user-form');
  const createMsg = document.getElementById('create-msg');
  const editModal = document.getElementById('edit-modal');
  const editModalClose = document.getElementById('edit-modal-close');
  const editForm = document.getElementById('edit-user-form');
  const editMsg = document.getElementById('edit-user-msg');
  const permsList = document.getElementById('edit-permissions-list');
  let _rooms = [];
  let _editingUserId = null;

  async function loadRooms() {
    const res = await fetch('/api/rooms');
    if (!res.ok) return;
    _rooms = await res.json();
  }

  async function loadAndRenderPermissions(userId) {
    const res = await fetch(`/api/users/${userId}/permissions`);
    const perms = res.ok ? await res.json() : [];
    const permMap = {};
    perms.forEach(p => { permMap[p.room_id] = p.access; });

    permsList.innerHTML = '';
    if (!_rooms.length) {
      permsList.innerHTML = '<span style="font-size:.82rem;color:var(--color-text-muted)">Aucune salle configurée</span>';
      return;
    }
    for (const room of _rooms) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:.75rem';
      const access = permMap[room.id] || '';
      row.innerHTML = `
        <span style="font-size:.85rem">${escHtml(room.name)}</span>
        <select class="select-input perm-select" data-room="${room.id}" style="width:auto;font-size:.82rem">
          <option value="">Aucun</option>
          <option value="read" ${access === 'read' ? 'selected' : ''}>Lecture</option>
          <option value="write" ${access === 'write' ? 'selected' : ''}>Écriture</option>
        </select>`;
      permsList.appendChild(row);
    }
  }

  async function savePermissions(userId) {
    const entries = [];
    permsList.querySelectorAll('.perm-select').forEach(sel => {
      if (sel.value) entries.push({ room_id: parseInt(sel.dataset.room), access: sel.value });
    });
    await fetch(`/api/users/${userId}/permissions`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entries),
    });
  }

  async function loadUsers() {
    const res = await fetch('/api/users');
    if (!res.ok) return;
    const users = await res.json();
    tbody.innerHTML = '';
    // Charger toutes les permissions en parallèle
    const permsMap = {};
    await Promise.all(users.map(async u => {
      const r = await fetch(`/api/users/${u.id}/permissions`);
      if (r.ok) permsMap[u.id] = await r.json();
      else permsMap[u.id] = [];
    }));

    users.forEach(u => {
      const perms = permsMap[u.id] || [];
      const writeRooms = perms.filter(p => p.access === 'write').map(p => _rooms.find(r => r.id === p.room_id)?.name).filter(Boolean);
      const readRooms  = perms.filter(p => p.access === 'read').map(p => _rooms.find(r => r.id === p.room_id)?.name).filter(Boolean);
      const locLabel = [
        ...writeRooms.map(n => `<span class="badge badge-write-room">${escHtml(n)}</span>`),
        ...readRooms.map(n => `<span class="badge badge-read-room">${escHtml(n)}</span>`),
      ].join(' ') || '<span style="color:var(--color-text-muted);font-size:.8rem">—</span>';

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${escHtml(u.username)}</strong></td>
        <td><span class="badge badge-role-${u.role}">${u.role === 'admin' ? 'Admin' : 'Contributeur'}</span></td>
        <td><span class="badge ${u.is_active ? 'badge-active' : 'badge-inactive'}">${u.is_active ? 'Actif' : 'Inactif'}</span></td>
        <td>${locLabel}</td>
        <td>${fmtDate(u.created_at)}</td>
        <td class="user-actions">
          <button class="btn btn-sm btn-ghost edit-btn" data-id="${u.id}" data-username="${escHtml(u.username)}" data-role="${u.role}">Modifier</button>
          <button class="btn btn-sm btn-ghost toggle-btn" data-id="${u.id}" data-active="${u.is_active}">${u.is_active ? 'Désactiver' : 'Activer'}</button>
          <button class="btn btn-sm btn-danger delete-btn" data-id="${u.id}">Supprimer</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        _editingUserId = btn.dataset.id;
        document.getElementById('edit-user-id').value = _editingUserId;
        document.getElementById('edit-username').value = btn.dataset.username;
        document.getElementById('edit-password').value = '';
        document.getElementById('edit-role').value = btn.dataset.role;
        editMsg.textContent = '';
        permsList.innerHTML = '<span style="font-size:.82rem;color:var(--color-text-muted)">Chargement…</span>';
        editModal.style.display = 'flex';
        await loadAndRenderPermissions(_editingUserId);
      });
    });

    tbody.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const isActive = btn.dataset.active === 'true';
        await fetch(`/api/users/${btn.dataset.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_active: !isActive }),
        });
        loadUsers();
      });
    });

    tbody.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Supprimer cet utilisateur ?')) return;
        const res = await fetch(`/api/users/${btn.dataset.id}`, { method: 'DELETE' });
        if (res.ok) {
          loadUsers();
        } else {
          const err = await res.json();
          alert(err.detail || 'Erreur');
        }
      });
    });
  }

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const res = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: fd.get('username'),
        password: fd.get('password'),
        role: fd.get('role'),
      }),
    });
    if (res.ok) {
      createForm.reset();
      createMsg.textContent = 'Compte créé !';
      createMsg.className = 'edit-msg edit-msg-ok';
      loadUsers();
    } else {
      const err = await res.json();
      createMsg.textContent = err.detail || 'Erreur';
      createMsg.className = 'edit-msg edit-msg-err';
    }
    setTimeout(() => { createMsg.textContent = ''; }, 3000);
  });

  editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('edit-user-id').value;
    const payload = {
      username: document.getElementById('edit-username').value,
      role: document.getElementById('edit-role').value,
    };
    const pw = document.getElementById('edit-password').value;
    if (pw) payload.password = pw;

    const res = await fetch(`/api/users/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) {
      const err = await res.json();
      editMsg.textContent = err.detail || 'Erreur';
      editMsg.className = 'edit-msg edit-msg-err';
      return;
    }
    await savePermissions(id);
    editModal.style.display = 'none';
    loadUsers();
  });

  editModalClose.addEventListener('click', () => { editModal.style.display = 'none'; });
  editModal.addEventListener('click', (e) => { if (e.target === editModal) editModal.style.display = 'none'; });

  loadRooms().then(loadUsers);
})();
</script>
{% endblock %}
