{% extends "base.html" %}
{% block title %}Tâches — Bibliodech{% endblock %}
{% block content %}
<div class="settings-container">
  <div class="settings-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem">
    <div>
      <h1 class="settings-title">Tâches</h1>
      <p class="settings-desc">Lancez manuellement ou planifiez les traitements automatiques.</p>
    </div>
    <span class="task-status" id="sched-save-status"></span>
  </div>

  <!-- Sélecteur de catégorie -->
  <div class="tasks-switcher">
    <button class="tasks-switch-btn active" data-panel="books">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Bibliothèque
    </button>
    <button class="tasks-switch-btn" data-panel="music">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
      Musique
    </button>
  </div>

  <div id="tasks-panel-books">
    <div class="tasks-list" id="tasks-list-books"></div>
  </div>

  <div id="tasks-panel-music" style="display:none">
    <div class="tasks-list" id="tasks-list-music"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  const INTERVAL_PRESETS = [
    { label: '15 min',   value: 15 },
    { label: '30 min',   value: 30 },
    { label: '1 heure',  value: 60 },
    { label: '6 heures', value: 360 },
    { label: '12 heures',value: 720 },
    { label: '24 heures',value: 1440 },
    { label: '7 jours',  value: 10080 },
  ];

  // ── Définition des groupes ─────────────────────────────────────────────────
  const GROUPS_BOOKS = [
    {
      id: 'g-enrichissement',
      name: 'Enrichissement',
      desc: 'Complète les données manquantes : livres non trouvés, genres, format des auteurs.',
      defaultInterval: 1440,
      tasks: [
        { id: 'reenrich',      name: 'Compléter les livres manquants',  desc: 'Relance l\'enrichissement pour les livres sans titre ou non trouvés lors du scan initial.' },
        { id: 'enrich-genres', name: 'Récupérer les genres',            desc: 'Interroge SUDOC et BnF par ISBN pour récupérer le genre (BD, Roman, Documentaire…).' },
        { id: 'clean-authors', name: 'Normaliser les auteurs',          desc: 'Convertit les auteurs "Nom, Prénom" → "Prénom Nom" pour tous les livres.' },
      ],
    },
    {
      id: 'g-couvertures',
      name: 'Couvertures',
      desc: 'Télécharge et met à jour les images de couverture.',
      defaultInterval: 1440,
      tasks: [
        { id: 'fetch-covers',   name: 'Rechercher les couvertures manquantes',      desc: 'Interroge Open Library et Google Books pour les livres sans couverture.' },
        { id: 'refresh-covers', name: 'Re-télécharger toutes les couvertures (HD)', desc: 'Force le re-cache HD de toutes les couvertures pour améliorer l\'affichage.' },
      ],
    },
    {
      id: 'g-series',
      name: 'Séries',
      desc: 'Détecte, enrichit et normalise les séries de la bibliothèque.',
      defaultInterval: 1440,
      expandTaskId: 'detect-series',
      tasks: [
        { id: 'sudoc-series',  name: 'Chercher dans le catalogue (SUDOC)',  desc: 'Interroge SUDOC et Open Library par ISBN pour trouver le nom de série.' },
        { id: 'ocr-series',    name: 'Lire les couvertures (OCR)',          desc: 'Reconnaissance de texte sur les couvertures pour trouver le nom de série imprimé.' },
        { id: 'detect-series', name: 'Détecter les séries',                 desc: 'Regroupe les livres par série selon le titre et les auteurs. Assigne automatiquement les cas certains.', expand: true },
        { id: 'bnf-series',    name: 'Compléter via la BnF',               desc: 'Pour chaque série avec des trous, interroge la BnF pour trouver les tomes manquants.' },
        { id: 'clean-series',  name: 'Normaliser les noms de séries',      desc: 'Capitalise la première lettre et supprime les espaces superflus.' },
      ],
    },
    {
      id: 'g-maintenance',
      name: 'Maintenance',
      desc: 'Sauvegarde et rechargement complet de la bibliothèque.',
      defaultInterval: 1440,
      tasks: [
        { id: 'backup',       name: 'Sauvegarder la base de données',  desc: 'Crée une copie de sauvegarde. Les 20 dernières sont conservées.' },
        { id: 'reenrich-all', name: 'Recharger toute la bibliothèque', desc: 'Ré-interroge toutes les sources pour chaque livre avec un ISBN.', static: true },
      ],
    },
  ];

  const GROUPS_MUSIC = [
    {
      id: 'g-music',
      name: 'Disques',
      desc: 'Enrichit et met à jour les pochettes de la médiathèque.',
      defaultInterval: 1440,
      tasks: [
        { id: 'reenrich-discs',      name: 'Compléter les disques manquants',     desc: 'Relance l\'enrichissement sur les disques non trouvés.' },
        { id: 'fetch-disc-covers',   name: 'Rechercher les pochettes manquantes', desc: 'Télécharge les pochettes absentes via MusicBrainz et Discogs.' },
        { id: 'refresh-disc-covers', name: 'Re-télécharger toutes les pochettes', desc: 'Force le re-cache HD de toutes les pochettes.' },
      ],
    },
  ];

  // Toutes les tâches individuelles (pour la planification)
  const ALL_TASKS = [...GROUPS_BOOKS, ...GROUPS_MUSIC].flatMap(g => g.tasks);
  const ALL_TASK_IDS = ALL_TASKS.map(t => t.id);

  const STATIC_TASKS = {
    'reenrich-all': {
      url: '/api/books/re-enrich-all?force=true', method: 'POST',
      label: r => `${r.queued} livre${r.queued !== 1 ? 's' : ''} en cours…`,
    },
  };

  let _schedules = {};

  // ── Rendu d'une carte groupe ───────────────────────────────────────────────
  function makeGroupCard(g) {
    // Déterminer dernier lancement + état auto du groupe (depuis les tâches membres)
    const memberConfigs = g.tasks.map(t => _schedules[t.id] || {});
    const anyEnabled = memberConfigs.some(c => c.enabled);
    const lastRuns = memberConfigs.map(c => c.last_run).filter(Boolean).sort();
    const lastRun = lastRuns[lastRuns.length - 1];
    const lastRunFmt = lastRun
      ? new Date(lastRun).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })
      : null;
    // Intervalle commun (premier membre qui en a un, sinon défaut)
    const interval = memberConfigs.find(c => c.interval_minutes)?.interval_minutes ?? g.defaultInterval;

    const card = document.createElement('div');
    card.className = 'task-card task-card-expand';
    card.id = `card-${g.id}`;
    card.innerHTML = `
      <div class="task-info">
        <div class="task-name">${escHtml(g.name)}</div>
        <div class="task-desc">${escHtml(g.desc)}</div>
        ${lastRunFmt ? `<div style="font-size:.75rem;color:var(--color-text-muted);margin-top:.25rem">Dernier lancement : ${lastRunFmt}</div>` : ''}
        <div id="next-run-${g.id}" class="task-next-run"></div>
      </div>
      <div class="task-actions" style="gap:.5rem">
        <span class="task-status" id="status-${g.id}"></span>
        <label style="display:flex;align-items:center;gap:.35rem;font-size:.82rem;cursor:pointer;white-space:nowrap">
          <input type="checkbox" id="sched-enabled-${g.id}" ${anyEnabled ? 'checked' : ''}>
          Auto
        </label>
        <select id="sched-interval-${g.id}" class="select-input" style="width:auto;font-size:.82rem">
          ${INTERVAL_PRESETS.map(p => `<option value="${p.value}" ${interval === p.value ? 'selected' : ''}>${p.label}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm group-run-btn" data-group="${g.id}">Lancer</button>
      </div>
      <div style="margin-top:1rem;width:100%">
        <details>
          <summary style="font-size:.82rem;color:var(--color-text-muted);cursor:pointer;user-select:none;margin-bottom:.5rem">Étapes détaillées</summary>
          <div class="tasks-list" style="gap:.4rem;margin-top:.5rem" id="subtasks-${g.id}"></div>
        </details>
        <div id="expand-detect-series" style="margin-top:.5rem"></div>
      </div>`;

    // Sous-tâches individuelles
    const subList = card.querySelector(`#subtasks-${g.id}`);
    for (const t of g.tasks) {
      const cfg = _schedules[t.id] || {};
      const sub = document.createElement('div');
      sub.className = 'task-card';
      sub.style.cssText = 'padding:.6rem 1rem;background:var(--color-surface-2,var(--color-surface));border-radius:8px';
      sub.innerHTML = `
        <div class="task-info">
          <div class="task-name" style="font-size:.88rem">${escHtml(t.name)}</div>
          <div class="task-desc" style="font-size:.78rem">${escHtml(t.desc)}</div>
        </div>
        <div class="task-actions">
          <span class="task-status" id="status-${t.id}"></span>
          <button class="btn btn-ghost btn-sm task-btn" data-task="${t.id}" style="font-size:.78rem;padding:.25rem .6rem">Lancer</button>
        </div>`;
      subList.appendChild(sub);
    }

    return card;
  }

  function renderGroups(groups, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for (const g of groups) {
      container.appendChild(makeGroupCard(g));
    }
  }

  // ── Switcher Bibliothèque / Musique ───────────────────────────────────────
  document.querySelectorAll('.tasks-switch-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tasks-switch-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const panel = btn.dataset.panel;
      document.getElementById('tasks-panel-books').style.display = panel === 'books' ? '' : 'none';
      document.getElementById('tasks-panel-music').style.display = panel === 'music' ? '' : 'none';
    });
  });

  // ── Next-run labels ───────────────────────────────────────────────────────
  let _nextRuns = {};

  function fmtNextRun(iso) {
    if (!iso) return null;
    const diff = new Date(iso) - Date.now();
    if (diff <= 0) return 'imminent';
    const s = Math.round(diff / 1000);
    if (s < 60) return `dans ${s}s`;
    const m = Math.round(s / 60);
    if (m < 60) return `dans ${m} min`;
    const h = Math.floor(m / 60), rm = m % 60;
    return rm ? `dans ${h}h ${rm}min` : `dans ${h}h`;
  }

  function updateNextRunLabels() {
    // Pour les groupes : prochain lancement = le plus tôt parmi les membres
    for (const g of [...GROUPS_BOOKS, ...GROUPS_MUSIC]) {
      const el = document.getElementById(`next-run-${g.id}`);
      if (!el) continue;
      const times = g.tasks.map(t => _nextRuns[t.id]).filter(Boolean).sort();
      const fmt = times[0] ? fmtNextRun(times[0]) : null;
      el.textContent = fmt ? `⏰ ${fmt}` : '';
    }
  }

  // ── Auto-save : quand on change le toggle/intervalle d'un groupe ──────────
  let _saveTimer = null;
  async function autoSave() {
    const statusEl = document.getElementById('sched-save-status');
    const body = {};
    for (const g of [...GROUPS_BOOKS, ...GROUPS_MUSIC]) {
      const enabled = document.getElementById(`sched-enabled-${g.id}`)?.checked ?? false;
      const interval = parseInt(document.getElementById(`sched-interval-${g.id}`)?.value ?? g.defaultInterval);
      // Propager à toutes les tâches membres (sauf statiques)
      for (const t of g.tasks) {
        if (!t.static) body[t.id] = { enabled, interval_minutes: interval };
      }
    }
    const res = await fetch('/api/tasks/schedules', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      _schedules = await res.json();
      statusEl.textContent = '✓ Enregistré';
      statusEl.className = 'task-status task-status-ok';
    } else {
      statusEl.textContent = 'Erreur';
      statusEl.className = 'task-status task-status-err';
    }
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'task-status'; }, 2000);
  }

  function wireAutoSave() {
    for (const g of [...GROUPS_BOOKS, ...GROUPS_MUSIC]) {
      document.getElementById(`sched-enabled-${g.id}`)?.addEventListener('change', autoSave);
      document.getElementById(`sched-interval-${g.id}`)?.addEventListener('change', autoSave);
    }
  }

  // ── Résultats et détails ───────────────────────────────────────────────────
  function _formatTaskResult(taskId, r) {
    if (taskId === 'detect-series') {
      const a = r.auto_assigned ?? 0, p = r.proposals ?? 0;
      return `${a} assigné${a !== 1 ? 's' : ''}, ${p} proposition${p !== 1 ? 's' : ''}`;
    }
    if (typeof r === 'object' && r !== null) {
      const parts = Object.entries(r)
        .filter(([k]) => !['assignments','proposals_detail'].includes(k))
        .map(([k, v]) => `${k}: ${v}`);
      return parts.join(', ') || 'OK';
    }
    return String(r || 'OK');
  }

  const _SIGNAL_LABELS = { title: 'titre', source_data: 'métadonnées', prefix: 'préfixe', author: 'auteur', 'author-title': 'auteur+titre' };

  function _renderDetectDetail(r) {
    const assignments = r.assignments || [];
    const proposals = r.proposals_detail || [];
    if (!assignments.length && !proposals.length) return '';
    let html = '<div style="font-size:.82rem;border-top:1px solid var(--color-border);padding-top:.75rem;display:grid;gap:.75rem">';
    if (assignments.length) {
      html += '<div><div style="font-weight:600;margin-bottom:.35rem">Assignations automatiques</div><table style="width:100%;border-collapse:collapse">';
      html += '<tr style="color:var(--color-text-muted);font-size:.78rem"><th style="text-align:left;padding:.2rem .4rem">Livre</th><th style="text-align:left;padding:.2rem .4rem">Série</th><th style="text-align:left;padding:.2rem .4rem">Signal</th></tr>';
      for (const a of assignments) {
        const pos = a.position != null ? ` <span style="color:var(--color-text-muted)">#${a.position}</span>` : '';
        html += `<tr style="border-top:1px solid var(--color-border-light,var(--color-border))">
          <td style="padding:.25rem .4rem">${escHtml(a.book)}</td>
          <td style="padding:.25rem .4rem;font-weight:500">${escHtml(a.series)}${pos}</td>
          <td style="padding:.25rem .4rem"><span class="badge">${escHtml(_SIGNAL_LABELS[a.signal] || a.signal)}</span></td>
        </tr>`;
      }
      html += '</table></div>';
    }
    if (proposals.length) {
      html += '<div><div style="font-weight:600;margin-bottom:.35rem">Propositions créées</div>';
      for (const p of proposals) {
        const name = p.proposed_name ? `<strong>${escHtml(p.proposed_name)}</strong>` : '<em style="color:var(--color-text-muted)">nom à définir</em>';
        const books = (p.books || []).map(b => escHtml(b)).join(', ');
        html += `<div style="padding:.3rem 0;border-top:1px solid var(--color-border-light,var(--color-border))">${name} — ${books} <span class="badge" style="margin-left:.25rem">${escHtml(_SIGNAL_LABELS[p.signal] || p.signal)}</span></div>`;
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  // ── Lancer une tâche individuelle ─────────────────────────────────────────
  async function runTask(taskId) {
    const statusEl = document.getElementById(`status-${taskId}`);
    if (statusEl) { statusEl.textContent = '⏳'; statusEl.className = 'task-status task-status-running'; }
    const staticTask = STATIC_TASKS[taskId];
    if (staticTask) {
      const res = await fetch(staticTask.url, { method: staticTask.method });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      const label = staticTask.label(data);
      if (statusEl) { statusEl.textContent = label; statusEl.className = 'task-status task-status-ok'; }
      return { label };
    }
    const res = await fetch(`/api/tasks/run/${taskId}`, { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const r = data.result || {};
    const label = _formatTaskResult(taskId, r);
    if (statusEl) { statusEl.textContent = label; statusEl.className = 'task-status task-status-ok'; }
    return { label, result: r };
  }

  // ── Lancer un groupe (tâches en séquence) ────────────────────────────────
  async function runGroup(groupId) {
    const group = [...GROUPS_BOOKS, ...GROUPS_MUSIC].find(g => g.id === groupId);
    if (!group) return;

    const btn = document.querySelector(`[data-group="${groupId}"]`);
    const statusEl = document.getElementById(`status-${groupId}`);
    const expandEl = document.getElementById(`expand-${groupId}`);

    btn.disabled = true;
    statusEl.textContent = 'En cours…';
    statusEl.className = 'task-status task-status-running';

    let completed = 0;
    const errors = [];

    for (const t of group.tasks) {
      statusEl.textContent = `${t.name}…`;
      try {
        const { result } = await runTask(t.id);
        completed++;
        // Afficher le détail de detect-series dans la zone expand
        if (t.id === 'detect-series' && result) {
          const detail = _renderDetectDetail(result);
          const detectEl = document.getElementById('expand-detect-series');
          if (detectEl && detail) detectEl.innerHTML = detail;
        }
      } catch (e) {
        errors.push(t.name);
        const statusSubEl = document.getElementById(`status-${t.id}`);
        if (statusSubEl) { statusSubEl.textContent = 'Erreur'; statusSubEl.className = 'task-status task-status-err'; }
      }
    }

    btn.disabled = false;
    if (errors.length === 0) {
      statusEl.textContent = `${completed} étape${completed > 1 ? 's' : ''} terminée${completed > 1 ? 's' : ''}`;
      statusEl.className = 'task-status task-status-ok';
    } else {
      statusEl.textContent = `${errors.length} erreur${errors.length > 1 ? 's' : ''}`;
      statusEl.className = 'task-status task-status-err';
    }
    setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'task-status'; }, 5000);
  }

  // ── Câblage des boutons ───────────────────────────────────────────────────
  function wireBtns() {
    // Boutons groupe
    document.querySelectorAll('.group-run-btn').forEach(btn => {
      btn.addEventListener('click', () => runGroup(btn.dataset.group));
    });
    // Boutons sous-tâche
    document.querySelectorAll('.task-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try { await runTask(btn.dataset.task); }
        catch { const s = document.getElementById(`status-${btn.dataset.task}`); if(s){ s.textContent='Erreur'; s.className='task-status task-status-err'; } }
        finally { btn.disabled = false; btn.textContent = 'Lancer'; }
      });
    });
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  async function loadSchedules() {
    const [r1, r2] = await Promise.all([
      fetch('/api/tasks/schedules'),
      fetch('/api/tasks/next-runs'),
    ]);
    _schedules = await r1.json();
    _nextRuns = await r2.json();
    renderGroups(GROUPS_BOOKS, 'tasks-list-books');
    renderGroups(GROUPS_MUSIC, 'tasks-list-music');
    wireAutoSave();
    wireBtns();
    updateNextRunLabels();
    setInterval(updateNextRunLabels, 30000);
  }

  loadSchedules();
})();
</script>
{% endblock %}
