<!-- Modale livre — include autonome. Expose window.openBookModal(id) -->
<!-- Requiert : user.role disponible dans le contexte Jinja2 -->

<!-- Modal principal -->
<div id="book-modal-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-card">
    <button class="modal-close" id="book-modal-close" aria-label="Fermer">&times;</button>
    <div id="book-modal-content"></div>
  </div>
</div>

<!-- Popup couverture -->
<div id="bm-cover-modal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
  <div class="modal-card" style="max-width:420px">
    <button class="modal-close" id="bm-cover-close">&times;</button>
    <h3 style="margin-bottom:1.25rem;font-size:1.05rem">Modifier la couverture</h3>
    <div style="display:flex;gap:1rem;align-items:flex-start;margin-bottom:1.25rem">
      <img id="bm-cover-preview" src="/static/img/no-cover.svg" alt="aperçu"
           style="width:72px;height:100px;object-fit:cover;border-radius:4px;background:var(--color-surface-2);flex-shrink:0"
           onerror="this.src='/static/img/no-cover.svg'">
      <div style="flex:1;min-width:0">
        <p style="font-size:.82rem;color:var(--color-text-muted);margin:0 0 .75rem">
          Choisissez un fichier image depuis votre appareil, ou collez l'URL directe d'une image.
        </p>
        <span id="bm-cover-status" style="font-size:.82rem"></span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:.9rem">
      <div>
        <p style="font-size:.78rem;font-weight:600;color:var(--color-text-muted);margin:0 0 .35rem;text-transform:uppercase;letter-spacing:.04em">Depuis un fichier</p>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:.4rem">
          Choisir une image…
          <input type="file" id="bm-cover-file" accept="image/*" style="display:none">
        </label>
        <span id="bm-cover-filename" style="font-size:.8rem;color:var(--color-text-muted);margin-left:.5rem"></span>
      </div>
      <div>
        <p style="font-size:.78rem;font-weight:600;color:var(--color-text-muted);margin:0 0 .35rem;text-transform:uppercase;letter-spacing:.04em">Depuis une URL</p>
        <div style="display:flex;gap:.4rem">
          <input type="url" id="bm-cover-url" placeholder="https://…" class="input-full" style="flex:1;min-width:0">
          <button type="button" id="bm-cover-url-btn" class="btn btn-ghost btn-sm">Importer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal prêt -->
<div id="bm-loan-modal" class="modal-overlay" style="display:none">
  <div class="modal-card" style="max-width:440px">
    <div class="modal-header">
      <h2 class="modal-title">Prêter un livre</h2>
      <button class="modal-close" onclick="document.getElementById('bm-loan-modal').style.display='none'">✕</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;gap:1rem">
      <div>
        <label class="field-label">Livre</label>
        <div id="bm-loan-book-title" style="font-weight:500"></div>
      </div>
      <div>
        <label class="field-label">Emprunteur</label>
        <select id="bm-loan-borrower" class="select-input" style="width:100%">
          <option value="">— choisir —</option>
        </select>
      </div>
      <div>
        <label class="field-label">Date de retour prévue <span style="color:var(--text-muted);font-weight:400">(optionnel)</span></label>
        <input type="date" id="bm-loan-due-date" class="search-input" style="width:100%">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('bm-loan-modal').style.display='none'">Annuler</button>
      <button class="btn btn-primary" id="bm-loan-submit">Prêter</button>
    </div>
  </div>
</div>

<script>
(function () {
  const isAdmin = {{ 'true' if user.role == 'admin' else 'false' }};
  const overlay = document.getElementById('book-modal-overlay');
  const content = document.getElementById('book-modal-content');
  let locTree = [];
  let allSources = [];
  let allSeries = [];
  let _coverBookId = null;

  // ── Init (charge locTree + sources + séries une seule fois) ──────────────
  async function _init() {
    const [r1, r2, r3] = await Promise.all([
      fetch('/api/locations/tree'),
      fetch('/api/settings/sources'),
      fetch('/api/series'),
    ]);
    locTree = r1.ok ? await r1.json() : [];
    allSources = r2.ok ? await r2.json() : [];
    allSeries = r3.ok ? await r3.json() : [];
  }
  const _ready = _init();

  // ── Helpers ───────────────────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  const SOURCE_LABELS = {
    sudoc:'📚 SUDOC', bnf:'🏛 BNF', decitre:'🛍 Decitre',
    googlebooks:'🔍 Google Books', openlibrary:'📖 Open Library',
    openlibrary_search:'📖 OL Search', isbndb:'🗄 ISBNdb',
    manual:'✏️ Manuel', pending:'⏳ En cours…',
  };
  function sourceLabel(src) { return SOURCE_LABELS[src] || escHtml(src); }

  const MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  function fmtDateFr(raw) {
    if (!raw) return '';
    const s = String(raw).trim();
    let m = s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
    if (m) {
      const y = m[1], mo = parseInt(m[2]) - 1, d = m[3] ? parseInt(m[3]) : null;
      if (d === 1) return `1er ${MOIS_FR[mo]} ${y}`;
      if (d) return `${d} ${MOIS_FR[mo]} ${y}`;
      return `${MOIS_FR[mo]} ${y}`;
    }
    if (/^\d{4}$/.test(s)) return s;
    m = s.match(/^(\d{1,2})\/(\d{2})\/(\d{4})$/);
    if (m) { const d=parseInt(m[1]),mo=parseInt(m[2])-1,y=m[3]; return d===1?`1er ${MOIS_FR[mo]} ${y}`:`${d} ${MOIS_FR[mo]} ${y}`; }
    return escHtml(s);
  }

  const DESC_LIMIT = 300;
  function descriptionBlock(desc) {
    if (!desc) return '';
    if (desc.length <= DESC_LIMIT) return `<div class="modal-description">${escHtml(desc)}</div>`;
    const short = escHtml(desc.slice(0, DESC_LIMIT).trimEnd());
    const full = escHtml(desc);
    return `<div class="modal-description">
      <span class="desc-short">${short}… <button type="button" class="btn-link" onclick="this.closest('.modal-description').querySelector('.desc-short').style.display='none';this.closest('.modal-description').querySelector('.desc-full').style.display='inline'">Voir plus</button></span>
      <span class="desc-full" style="display:none">${full} <button type="button" class="btn-link" onclick="this.closest('.modal-description').querySelector('.desc-full').style.display='none';this.closest('.modal-description').querySelector('.desc-short').style.display='inline'">Voir moins</button></span>
    </div>`;
  }

  const SOURCE_FIELDS = [
    { key:'title', label:'Titre' }, { key:'subtitle', label:'Sous-titre' },
    { key:'authors', label:'Auteurs' }, { key:'publisher', label:'Éditeur' },
    { key:'publish_date', label:'Date' }, { key:'language', label:'Langue' },
    { key:'page_count', label:'Pages' },
    { key:'series_name', label:'Série (source)' }, { key:'series_volume', label:'Tome (source)' },
    { key:'genre', label:'Genre' },
  ];

  function renderSourcesTab(book) {
    const sd = book.source_data || {};
    const configIds = allSources.map(s => s.id);
    const dataIds = Object.keys(sd).filter(id => !configIds.includes(id));
    const allCols = [...configIds, ...dataIds];
    const noData = !Object.keys(sd).length;
    const rows = SOURCE_FIELDS.map(({ key, label }) => {
      const bookVal = key === 'authors' ? (book.authors || []).join(', ') : book[key];
      const cells = allCols.map(sid => {
        const data = sd[sid];
        if (!data) return `<td class="src-cell src-empty src-no-data">—</td>`;
        let val = data[key];
        if (val === null || val === undefined || val === '') return `<td class="src-cell src-empty">—</td>`;
        if (Array.isArray(val)) val = val.join(', ');
        const isChosen = String(val) === String(bookVal ?? '');
        return `<td class="src-cell ${isChosen ? 'src-chosen' : ''}">${escHtml(String(val))}</td>`;
      });
      return `<tr><th class="src-row-label">${label}</th>${cells.join('')}</tr>`;
    }).join('');
    const headers = allCols.map(sid => {
      const cfg = allSources.find(s => s.id === sid);
      const hasData = !!sd[sid];
      const enabled = cfg ? cfg.enabled : true;
      const isActive = book.enrichment_source === sid;
      return `<th class="src-col-head ${!enabled ? 'src-col-disabled' : ''} ${isActive ? 'src-col-active' : ''}">
        <div class="src-col-head-inner"><span>${sourceLabel(sid)}</span>
          <button class="btn btn-xs btn-ghost src-reload-btn" data-source="${sid}" title="Recharger depuis ${sourceLabel(sid)}">↺</button>
          ${hasData && !isActive ? `<button class="btn btn-xs btn-primary src-apply-btn" data-source="${sid}" title="Appliquer cette source">✓ Utiliser</button>` : ''}
          ${isActive ? '<span class="src-active-badge">active</span>' : ''}
        </div>${!hasData ? '<span class="src-col-badge">pas de données</span>' : ''}</th>`;
    }).join('');
    return `<div class="src-table-wrap"><table class="src-table">
      <thead><tr><th class="src-corner"></th>${headers}</tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="src-legend"><span class="src-chosen-dot"></span> Valeur retenue dans la fiche
      ${noData ? ' &nbsp;·&nbsp; <em>Aucune donnée — lancez 🔄 Relancer pour peupler.</em>' : ''}</p>`;
  }

  // ── Ouvrir / fermer ───────────────────────────────────────────────────────
  window.openBookModal = async function (bookId) {
    await _ready;
    const res = await fetch(`/api/books/${bookId}`);
    const book = await res.json();
    renderModal(book);
    overlay.style.display = 'flex';
    document.body.classList.add('modal-open');
  };

  function closeModal() {
    overlay.style.display = 'none';
    document.body.classList.remove('modal-open');
  }

  // ── Rendu ─────────────────────────────────────────────────────────────────
  function renderModal(book) {
    const authors = Array.isArray(book.authors) ? book.authors.join(', ') : '';
    const coverSrc = book.cover_url || '/static/img/no-cover.svg';
    content.innerHTML = `
      <div class="modal-header">
        <img src="${escHtml(coverSrc)}" alt="couverture" class="modal-cover" onerror="this.src='/static/img/no-cover.svg'">
        <div class="modal-header-info">
          <h2 class="modal-title">${escHtml(book.title)}</h2>
          ${book.subtitle ? `<p class="modal-subtitle">${escHtml(book.subtitle)}</p>` : ''}
          ${authors ? `<p class="modal-authors">${escHtml(authors)}</p>` : ''}
          ${book.publisher ? `<p class="modal-publisher">${escHtml(book.publisher)}${book.publish_date ? ' · ' + fmtDateFr(book.publish_date) : ''}</p>` : ''}
          ${book.page_count ? `<p class="modal-pages">${book.page_count} pages</p>` : ''}
          <div class="modal-badges">
            ${book.isbn ? `<span class="badge badge-isbn">ISBN: ${escHtml(book.isbn)}</span>` : ''}
            ${book.genre ? `<span class="badge badge-genre">${escHtml(book.genre)}</span>` : ''}
            <span class="badge badge-source badge-source-${escHtml(book.source)}">${sourceLabel(book.source)}</span>
          </div>
        </div>
      </div>
      ${descriptionBlock(book.description)}
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="edit">Édition</button>
        <button class="modal-tab" data-tab="sources">Sources <span class="modal-tab-count">${book.source_data ? Object.keys(book.source_data).length : 0}</span></button>
        <button class="modal-tab" data-tab="logs">Historique</button>
      </div>
      <div class="modal-tab-panel" id="bm-tab-edit">
        <form id="bm-edit-form" class="edit-form">
          <input type="hidden" name="book_id" value="${book.id}">
          <div class="form-grid">
            <div class="field"><label>Titre</label><input type="text" name="title" value="${escHtml(book.title)}" required></div>
            <div class="field"><label>Auteurs (séparés par virgule)</label><input type="text" name="authors" value="${escHtml(authors)}"></div>
            <div class="field"><label>Éditeur</label><input type="text" name="publisher" value="${escHtml(book.publisher || '')}"></div>
            <div class="field"><label>Genre</label><input type="text" name="genre" value="${escHtml(book.genre || '')}" placeholder="ex: Bandes dessinées, Roman…"></div>
          </div>
          <div class="field-separator">Série</div>
          <div class="form-grid form-grid-2">
            <div class="field"><label>Série</label>
              <select id="bm-series" class="input-full">
                <option value="">— Aucune série —</option>
                ${allSeries.map(s => `<option value="${s.id}" ${book.series_id == s.id ? 'selected' : ''}>${escHtml(s.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Tome</label>
              <input type="number" id="bm-series-pos" step="0.5" min="0" placeholder="ex: 1" value="${book.series_position ?? ''}">
            </div>
          </div>
          <div class="field-separator">Localisation</div>
          <div class="form-grid form-grid-2">
            <div class="field"><label>Adresse</label>
              <select id="bm-loc-site" class="input-full">
                <option value="">— Choisir —</option>
                ${locTree.map(s => `<option value="${s.id}" ${book.location?.site_id == s.id ? 'selected' : ''}>${escHtml(s.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Pièce</label>
              <select id="bm-loc-room" class="input-full">
                <option value="">— Choisir —</option>
                ${(locTree.find(s => s.id == book.location?.site_id)?.rooms || []).map(r => `<option value="${r.id}" ${book.location?.room_id == r.id ? 'selected' : ''}>${escHtml(r.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <button type="button" class="btn btn-ghost" id="bm-cover-btn">Modifier la couverture</button>
            ${book.active_loan
              ? `<button type="button" class="btn btn-ghost" id="bm-return-btn">Rendu ✓ (${escHtml(book.active_loan.borrower_name || '')})</button>`
              : `<button type="button" class="btn btn-ghost" id="bm-loan-btn">Prêter…</button>`}
            ${book.isbn ? `<button type="button" class="btn btn-ghost" id="bm-reenrich-btn">🔄 Relancer</button>` : ''}
            ${isAdmin ? `<button type="button" class="btn btn-danger" id="bm-delete-btn">Supprimer</button>` : ''}
          </div>
          <div id="bm-reenrich-msg" class="edit-msg"></div>
          <div id="bm-edit-msg" class="edit-msg"></div>
        </form>
      </div>
      <div class="modal-tab-panel" id="bm-tab-sources" style="display:none">${renderSourcesTab(book)}</div>
      <div class="modal-tab-panel" id="bm-tab-logs" style="display:none"><div id="bm-logs-content" class="logs-loading">Chargement…</div></div>`;

    // Onglets
    const ACTION_LABELS = { created:{label:'Créé',cls:'log-created'}, updated:{label:'Modifié',cls:'log-updated'}, enriched:{label:'Enrichi',cls:'log-enriched'}, deleted:{label:'Supprimé',cls:'log-deleted'} };
    const FIELD_LABELS = { title:'Titre', subtitle:'Sous-titre', authors:'Auteurs', publisher:'Éditeur', publish_date:'Date', language:'Langue', page_count:'Pages', location_id:'Localisation', room_id:'Salle', cover_url:'Couverture' };
    function renderLogs(logs) {
      if (!logs.length) return '<p class="stat-empty" style="margin:2rem 0">Aucun historique.</p>';
      return logs.map(l => {
        const meta = ACTION_LABELS[l.action] || { label:l.action, cls:'' };
        const date = l.created_at ? new Date(l.created_at).toLocaleString('fr-FR') : '';
        let detail = '';
        if (l.action==='updated' && l.detail) {
          const fields = Object.entries(l.detail).filter(([k])=>!['source_data'].includes(k))
            .map(([k,v])=>{ const label=FIELD_LABELS[k]||k; const to=typeof v==='object'&&v!==null?v.to:v; return `<span class="log-field">${escHtml(label)} → <em>${escHtml(String(to??''))}</em></span>`; });
          if (fields.length) detail=`<div class="log-detail">${fields.join('')}</div>`;
        } else if (l.action==='enriched'&&l.detail?.source) {
          detail=`<div class="log-detail"><span class="log-field">via ${escHtml(l.detail.source)}</span></div>`;
        } else if (l.action==='created'&&l.detail?.isbn) {
          detail=`<div class="log-detail"><span class="log-field">ISBN ${escHtml(l.detail.isbn)}</span></div>`;
        }
        return `<div class="log-entry"><span class="log-badge ${meta.cls}">${meta.label}</span><span class="log-who">${l.username?escHtml(l.username):'système'}</span><span class="log-date">${date}</span>${detail}</div>`;
      }).join('');
    }
    let logsLoaded = false;
    content.querySelectorAll('.modal-tab').forEach(tab => {
      tab.addEventListener('click', async () => {
        content.querySelectorAll('.modal-tab').forEach(t=>t.classList.remove('active'));
        content.querySelectorAll('.modal-tab-panel').forEach(p=>p.style.display='none');
        tab.classList.add('active');
        document.getElementById('bm-tab-'+tab.dataset.tab).style.display='';
        if (tab.dataset.tab==='logs'&&!logsLoaded) {
          logsLoaded=true;
          const r = await fetch(`/api/books/${book.id}/logs`);
          document.getElementById('bm-logs-content').innerHTML = renderLogs(await r.json());
        }
      });
    });

    // Reload + Apply par source
    function wireSourceBtns() {
      content.querySelectorAll('.src-reload-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const sid = btn.dataset.source;
          btn.disabled=true; btn.textContent='⏳';
          const r = await fetch(`/api/books/${book.id}/re-enrich-source/${sid}`, {method:'POST'});
          const data = await r.json();
          if (!r.ok) { btn.disabled=false; btn.textContent='↺'; btn.title=data.detail||'Erreur'; return; }
          book.source_data = data.source_data;
          document.getElementById('bm-tab-sources').innerHTML = renderSourcesTab(book);
          const badge = content.querySelector('.modal-tab[data-tab="sources"] .modal-tab-count');
          if (badge) badge.textContent = Object.keys(data.source_data||{}).length;
          wireSourceBtns();
        });
      });
      content.querySelectorAll('.src-apply-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const sid = btn.dataset.source;
          btn.disabled=true; btn.textContent='⏳';
          const r = await fetch(`/api/books/${book.id}/apply-source/${sid}`, {method:'POST'});
          const data = await r.json();
          if (!r.ok) { btn.disabled=false; btn.textContent='✓ Utiliser'; btn.title=data.detail||'Erreur'; return; }
          // Mettre à jour le livre local et re-rendre
          Object.assign(book, data);
          renderModal(book);
          // Repasser sur l'onglet Sources
          content.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
          content.querySelectorAll('.modal-tab-panel').forEach(p => p.style.display='none');
          const srcTab = content.querySelector('.modal-tab[data-tab="sources"]');
          const srcPanel = document.getElementById('bm-tab-sources');
          if (srcTab) srcTab.classList.add('active');
          if (srcPanel) srcPanel.style.display='';
        });
      });
    }
    wireSourceBtns();

    // Cascade localisation
    const mSite = document.getElementById('bm-loc-site');
    const mRoom = document.getElementById('bm-loc-room');
    if (mSite) {
      mSite.addEventListener('change', () => {
        const site = locTree.find(s => s.id == mSite.value);
        mRoom.innerHTML = '<option value="">— Choisir —</option>'
          + (site ? site.rooms.map(r=>`<option value="${r.id}">${escHtml(r.name)}</option>`).join('') : '');
        mRoom.disabled = !site || !site.rooms.length;
      });
    }

    // Enregistrer
    document.getElementById('bm-edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const bookId = fd.get('book_id');
      const authorsList = (fd.get('authors')||'').split(',').map(a=>a.trim()).filter(Boolean);
      const roomId = document.getElementById('bm-loc-room')?.value ? parseInt(document.getElementById('bm-loc-room').value) : null;
      const seriesVal = document.getElementById('bm-series')?.value;
      const seriesId = seriesVal ? parseInt(seriesVal) : null;
      const seriesPosVal = document.getElementById('bm-series-pos')?.value;
      const seriesPos = seriesPosVal !== '' && seriesPosVal !== null ? parseFloat(seriesPosVal) : null;
      const payload = { title: fd.get('title'), authors: authorsList, publisher: fd.get('publisher')||null, genre: fd.get('genre')||null, room_id: roomId, series_id: seriesId, series_position: seriesPos };
      const res = await fetch(`/api/books/${bookId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const msg = document.getElementById('bm-edit-msg');
      if (res.ok) {
        msg.textContent='Enregistré !'; msg.className='edit-msg edit-msg-ok';
        window.onBookModalSaved?.();
        setTimeout(closeModal, 800);
      } else {
        const err = await res.json();
        msg.textContent = err.detail||'Erreur'; msg.className='edit-msg edit-msg-err';
      }
    });

    // Supprimer
    if (isAdmin) {
      document.getElementById('bm-delete-btn')?.addEventListener('click', async () => {
        if (!confirm('Supprimer ce livre définitivement ?')) return;
        const bookId = document.querySelector('#bm-edit-form [name="book_id"]').value;
        const res = await fetch(`/api/books/${bookId}`, { method:'DELETE' });
        if (res.ok) { closeModal(); window.onBookModalDeleted?.(); }
      });
    }

    // Prêter
    document.getElementById('bm-loan-btn')?.addEventListener('click', async () => {
      const bookId = parseInt(document.querySelector('#bm-edit-form [name="book_id"]').value);
      const title = document.querySelector('#bm-edit-form [name="title"]').value;
      document.getElementById('bm-loan-book-title').textContent = title;
      document.getElementById('bm-loan-due-date').value = '';
      document.getElementById('bm-loan-modal').dataset.bookId = bookId;
      await _populateLoanSelect(document.getElementById('bm-loan-borrower'));
      document.getElementById('bm-loan-modal').style.display='flex';
    });

    // Retour prêt
    document.getElementById('bm-return-btn')?.addEventListener('click', async () => {
      await fetch(`/api/loans/${book.active_loan.id}/return`, { method:'POST' });
      closeModal(); window.onBookModalSaved?.();
    });

    // Couverture
    document.getElementById('bm-cover-btn')?.addEventListener('click', () => {
      const bookId = document.querySelector('#bm-edit-form [name="book_id"]').value;
      const currentSrc = content.querySelector('.modal-cover')?.src || '/static/img/no-cover.svg';
      _openCoverModal(bookId, currentSrc);
    });

    // Ré-enrichissement
    document.getElementById('bm-reenrich-btn')?.addEventListener('click', async () => {
      const bookId = document.querySelector('#bm-edit-form [name="book_id"]').value;
      const msg = document.getElementById('bm-reenrich-msg');
      const btn = document.getElementById('bm-reenrich-btn');
      btn.disabled=true; btn.textContent='⏳ Recherche…'; msg.textContent='';
      const res = await fetch(`/api/books/${bookId}/re-enrich`, { method:'POST' });
      if (!res.ok) { msg.textContent='Erreur.'; msg.className='edit-msg edit-msg-err'; btn.disabled=false; btn.textContent='🔄 Relancer'; return; }
      let dots=0;
      const t = setInterval(async () => {
        dots=(dots+1)%4; btn.textContent='⏳'+'.'.repeat(dots+1);
        try {
          const r = await fetch(`/api/scan/status/${bookId}`);
          const d = await r.json();
          if (d.enrichment_status==='ok') { clearInterval(t); renderModal(d.book); window.onBookModalSaved?.(); }
          else if (d.enrichment_status==='not_found') { clearInterval(t); msg.textContent='Introuvable.'; msg.className='edit-msg edit-msg-err'; btn.disabled=false; btn.textContent='🔄 Relancer'; }
        } catch {}
      }, 1500);
    });
  }

  // ── Couverture popup ──────────────────────────────────────────────────────
  function _openCoverModal(bookId, currentSrc) {
    _coverBookId = bookId;
    document.getElementById('bm-cover-preview').src = currentSrc;
    document.getElementById('bm-cover-url').value = '';
    document.getElementById('bm-cover-filename').textContent = '';
    document.getElementById('bm-cover-status').textContent = '';
    document.getElementById('bm-cover-modal').style.display = 'flex';
  }

  async function _submitCover(fd) {
    const statusEl = document.getElementById('bm-cover-status');
    statusEl.style.color='var(--color-text-muted)'; statusEl.textContent='Envoi…';
    const res = await fetch(`/api/books/${_coverBookId}/cover`, { method:'POST', body: fd });
    if (res.ok) {
      const updated = await res.json();
      const newSrc = updated.cover_url + '?t=' + Date.now();
      document.getElementById('bm-cover-preview').src = newSrc;
      const mainCover = content.querySelector('.modal-cover');
      if (mainCover) mainCover.src = newSrc;
      statusEl.style.color='var(--color-success,#22c55e)'; statusEl.textContent='Couverture mise à jour.';
      window.onBookModalSaved?.();
      setTimeout(() => { document.getElementById('bm-cover-modal').style.display='none'; }, 900);
    } else {
      const err = await res.json().catch(()=>({}));
      statusEl.style.color='var(--color-danger)'; statusEl.textContent=err.detail||'Erreur.';
    }
  }

  document.getElementById('bm-cover-close').addEventListener('click', () => { document.getElementById('bm-cover-modal').style.display='none'; });
  document.getElementById('bm-cover-modal').addEventListener('click', e => { if(e.target===document.getElementById('bm-cover-modal')) document.getElementById('bm-cover-modal').style.display='none'; });
  document.getElementById('bm-cover-file').addEventListener('change', async () => {
    const f = document.getElementById('bm-cover-file').files[0];
    if (!f) return;
    document.getElementById('bm-cover-filename').textContent = f.name;
    document.getElementById('bm-cover-preview').src = URL.createObjectURL(f);
    const fd = new FormData(); fd.append('file', f);
    await _submitCover(fd);
  });
  document.getElementById('bm-cover-url-btn').addEventListener('click', async () => {
    const url = document.getElementById('bm-cover-url').value.trim();
    if (!url) return;
    const fd = new FormData(); fd.append('url', url);
    await _submitCover(fd);
  });
  document.getElementById('bm-cover-url').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();document.getElementById('bm-cover-url-btn').click();} });

  // ── Prêt popup ────────────────────────────────────────────────────────────
  async function _populateLoanSelect(sel) {
    const [r1, r2] = await Promise.all([fetch('/api/users/active'), fetch('/api/borrowers')]);
    const users = r1.ok ? await r1.json() : [];
    const borrowers = r2.ok ? await r2.json() : [];
    sel.innerHTML = '<option value="">— choisir —</option>';
    if (users.length) { const g=document.createElement('optgroup'); g.label='Utilisateurs du site'; users.forEach(u=>{ const o=document.createElement('option'); o.value='u:'+u.id; o.textContent=u.username; g.appendChild(o); }); sel.appendChild(g); }
    if (borrowers.length) { const g=document.createElement('optgroup'); g.label='Emprunteurs externes'; borrowers.forEach(b=>{ const o=document.createElement('option'); o.value='b:'+b.id; o.textContent=b.name; g.appendChild(o); }); sel.appendChild(g); }
  }

  document.getElementById('bm-loan-submit').addEventListener('click', async () => {
    const modal = document.getElementById('bm-loan-modal');
    const bookId = parseInt(modal.dataset.bookId);
    const val = document.getElementById('bm-loan-borrower').value;
    const who = val.startsWith('u:') ? {user_id:parseInt(val.slice(2))} : val.startsWith('b:') ? {borrower_id:parseInt(val.slice(2))} : {};
    if (!who.borrower_id && !who.user_id) { alert('Choisissez un emprunteur.'); return; }
    const dueDate = document.getElementById('bm-loan-due-date').value || null;
    const res = await fetch('/api/loans', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({book_id:bookId,...who,due_date:dueDate}) });
    if (!res.ok) { const err=await res.json(); alert(err.detail||'Erreur'); return; }
    modal.style.display='none'; window.onBookModalSaved?.();
  });

  // ── Fermeture ─────────────────────────────────────────────────────────────
  document.getElementById('book-modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape'&&overlay.style.display!=='none') closeModal(); });
})();
</script>
