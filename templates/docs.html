{% extends "base.html" %}
{% block title %}Documentation — Bibliodech{% endblock %}

{% block content %}
<div class="docs-page">
  <aside class="docs-sidebar">
    <div class="docs-sidebar-title">Documentation</div>
    <nav class="docs-nav">
      {% for f in doc_files %}
      <a href="#" class="docs-nav-item" data-slug="{{ f.slug }}">{{ f.label }}</a>
      {% endfor %}
    </nav>
  </aside>
  <main class="docs-content">
    <div id="docs-loading" style="color:var(--color-text-muted);padding:2rem">Sélectionnez un document…</div>
    <article id="docs-body" class="markdown-body" style="display:none"></article>
  </main>
</div>

<style>
.docs-page {
  display: flex;
  height: calc(100vh - 56px);
  overflow: hidden;
}
.docs-sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--color-border);
  background: var(--color-surface);
  overflow-y: auto;
  padding: .75rem 0;
}
.docs-sidebar-title {
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--color-text-muted);
  padding: .25rem 1rem .5rem;
}
.docs-nav-item {
  display: block;
  padding: .45rem 1rem;
  font-size: .88rem;
  color: var(--color-text);
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: background .1s;
}
.docs-nav-item:hover { background: var(--color-surface-2); }
.docs-nav-item.active {
  color: var(--color-primary);
  border-left-color: var(--color-primary);
  background: var(--color-surface-2);
  font-weight: 600;
}
.docs-content {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 2.5rem;
  max-width: 860px;
}

/* Markdown styles */
.markdown-body { line-height: 1.7; font-size: .95rem; }
.markdown-body h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 1.25rem; border-bottom: 2px solid var(--color-border); padding-bottom: .5rem; }
.markdown-body h2 { font-size: 1.2rem; font-weight: 700; margin: 2rem 0 .75rem; color: var(--color-primary); }
.markdown-body h3 { font-size: 1rem; font-weight: 700; margin: 1.5rem 0 .5rem; }
.markdown-body p { margin: 0 0 .9rem; }
.markdown-body ul, .markdown-body ol { margin: 0 0 .9rem 1.5rem; }
.markdown-body li { margin-bottom: .25rem; }
.markdown-body code {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: .1rem .35rem;
  font-size: .85em;
  font-family: ui-monospace, monospace;
}
.markdown-body pre {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: 6px;
  padding: 1rem 1.25rem;
  overflow-x: auto;
  margin: 0 0 1rem;
}
.markdown-body pre code {
  background: none;
  border: none;
  padding: 0;
  font-size: .85rem;
}
.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 1rem;
  font-size: .88rem;
}
.markdown-body th, .markdown-body td {
  border: 1px solid var(--color-border);
  padding: .4rem .75rem;
  text-align: left;
}
.markdown-body th { background: var(--color-surface-2); font-weight: 600; }
.markdown-body blockquote {
  border-left: 3px solid var(--color-primary);
  margin: 0 0 1rem;
  padding: .5rem 1rem;
  color: var(--color-text-muted);
  background: var(--color-surface-2);
  border-radius: 0 4px 4px 0;
}
.markdown-body a { color: var(--color-primary); }
.markdown-body hr { border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0; }
.markdown-body strong { font-weight: 700; }

@media (max-width: 640px) {
  .docs-sidebar { width: 160px; }
  .docs-content { padding: 1rem; }
}
</style>

<script src="/static/js/marked.min.js"></script>
<script>
(function () {
  const navItems = document.querySelectorAll('.docs-nav-item');
  const docsBody = document.getElementById('docs-body');
  const docsLoading = document.getElementById('docs-loading');

  marked.setOptions({ breaks: true, gfm: true });

  async function loadDoc(slug) {
    docsLoading.textContent = 'Chargement…';
    docsLoading.style.display = '';
    docsBody.style.display = 'none';

    navItems.forEach(n => n.classList.toggle('active', n.dataset.slug === slug));

    try {
      const r = await fetch(`/api/docs/${slug}`);
      if (!r.ok) throw new Error('Erreur');
      const md = await r.text();
      docsBody.innerHTML = marked.parse(md);
      docsBody.style.display = '';
      docsLoading.style.display = 'none';
      docsBody.scrollTop = 0;
      document.querySelector('.docs-content').scrollTop = 0;
      history.replaceState(null, '', `?doc=${slug}`);
    } catch {
      docsLoading.textContent = 'Erreur de chargement.';
    }
  }

  navItems.forEach(item => {
    item.addEventListener('click', e => {
      e.preventDefault();
      loadDoc(item.dataset.slug);
    });
  });

  // Charger le doc passé en query param ou le premier par défaut
  const params = new URLSearchParams(location.search);
  const initial = params.get('doc') || navItems[0]?.dataset.slug;
  if (initial) loadDoc(initial);
})();
</script>
{% endblock %}
