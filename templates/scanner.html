{% extends "base.html" %}
{% block title %}Scanner – Bibliodech{% endblock %}

{% block content %}
<div class="scanner-page">

  <!-- Localisation en cascade -->
  <div class="location-bar">
    <span class="location-bar-label">Localisation :</span>
    <div class="location-bar-fields">
      <div class="location-bar-field">
        <label for="loc-site">Adresse</label>
        <select id="loc-site">
          <option value="">— Choisir —</option>
        </select>
      </div>
      <span class="location-bar-sep">›</span>
      <div class="location-bar-field">
        <label for="loc-room">Pièce</label>
        <select id="loc-room" disabled>
          <option value="">— Choisir —</option>
        </select>
      </div>
      <span class="location-bar-sep">›</span>
      <div class="location-bar-field">
        <label for="loc-shelf">Étagère</label>
        <select id="loc-shelf" disabled>
          <option value="">— Choisir —</option>
        </select>
      </div>

    </div>
    <a href="/locations" class="location-bar-manage" title="Gérer les localisations">⚙</a>
  </div>

  <!-- Caméra overlay (live scan) -->
  <div id="cam-overlay" class="cam-overlay" style="display:none" aria-hidden="true">
    <div id="quagga-viewport" class="quagga-viewport"></div>
    <div class="cam-frame-overlay">
      <div class="cam-laser"></div>
    </div>
    <div class="cam-live-feed" id="cam-live-feed"></div>
    <button id="cam-torch" class="btn cam-torch-btn" style="display:none" title="Flash">🔦</button>
    <button id="cam-close" class="btn cam-close-btn">✕ Fermer</button>
  </div>
  <!-- Overlay BarcodeDetector natif -->
  <!-- Overlay BarcodeDetector natif -->
  <div id="native-cam-overlay" class="cam-overlay" style="display:none" aria-hidden="true">
    <video id="native-cam-video" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
    <div class="cam-frame-overlay"><div class="cam-laser"></div></div>
    <div class="cam-live-feed" id="native-cam-feed"></div>
    <div style="position:absolute;top:.75rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:.25rem .6rem;border-radius:99px;white-space:nowrap">BarcodeDetector natif</div>
    <button id="native-cam-close" class="btn cam-close-btn">✕ Fermer</button>
  </div>

  <!-- Overlay ZXing -->
  <div id="zxing-cam-overlay" class="cam-overlay" style="display:none" aria-hidden="true">
    <video id="zxing-cam-video" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video>
    <div class="cam-frame-overlay"><div class="cam-laser"></div></div>
    <div class="cam-live-feed" id="zxing-cam-feed"></div>
    <div style="position:absolute;top:.75rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:.72rem;padding:.25rem .6rem;border-radius:99px;white-space:nowrap">ZXing</div>
    <button id="zxing-cam-close" class="btn cam-close-btn">✕ Fermer</button>
  </div>

  <!-- Fallback iOS : input fichier caméra -->
  <input type="file" id="cam-file-input" accept="image/*" capture="environment" style="display:none">

  <!-- ISBN input -->
  <div class="scan-area">
    <div class="scan-input-row">
      <input
        type="text"
        id="isbn-input"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Saisir un ISBN…"
        class="isbn-input"
      >
      <button id="cam-btn" class="btn btn-primary cam-btn" title="Scanner avec Quagga (JS)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span class="cam-btn-label">Quagga</span>
      </button>
      <button id="native-cam-btn" class="btn btn-secondary cam-btn" title="Scanner avec BarcodeDetector natif" style="display:none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h2v10H7zm4 0h1v10h-1zm3 0h3v10h-3z"/></svg>
        <span class="cam-btn-label">Natif</span>
      </button>
      <button id="zxing-cam-btn" class="btn btn-secondary cam-btn" title="Scanner avec ZXing">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="7" x2="7" y2="17"/><line x1="10" y1="7" x2="10" y2="17"/><line x1="13" y1="7" x2="13" y2="11"/><line x1="16" y1="7" x2="16" y2="17"/><line x1="13" y1="14" x2="13" y2="17"/></svg>
        <span class="cam-btn-label">ZXing</span>
      </button>
    </div>
    <p class="scan-hint" id="scan-hint-text">Saisissez un ISBN ou utilisez la caméra</p>
    <div id="scan-loading" class="scan-loading" style="display:none">
      <span class="scan-spinner"></span>
      <span id="scan-loading-isbn"></span>
    </div>
  </div>

  <!-- Manual entry form (hidden by default) -->
  <div id="manual-form-container" class="manual-form-container" style="display:none">
    <div class="manual-form-card">
      <h3>Saisie manuelle</h3>
      <p class="manual-isbn-label">ISBN : <strong id="manual-isbn-display"></strong></p>
      <form id="manual-form">
        <div class="field">
          <label for="manual-title">Titre <span class="required">*</span></label>
          <input type="text" id="manual-title" name="title" required placeholder="Titre du livre">
        </div>
        <div class="field">
          <label for="manual-authors">Auteurs</label>
          <input type="text" id="manual-authors" name="authors" placeholder="Prénom Nom, Prénom Nom…">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Ajouter</button>
          <button type="button" class="btn btn-ghost" id="manual-cancel">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Feed -->
  <div id="scan-feed" class="scan-feed"></div>

</div>
{% include "_book_modal.html" %}
{% endblock %}

{% block scripts %}
<script>
(function () {
  const isbnInput = document.getElementById('isbn-input');
  const feed = document.getElementById('scan-feed');
  const manualContainer = document.getElementById('manual-form-container');
  const manualForm = document.getElementById('manual-form');
  const manualIsbnDisplay = document.getElementById('manual-isbn-display');
  const manualCancel = document.getElementById('manual-cancel');

  const selSite      = document.getElementById('loc-site');
  const selRoom      = document.getElementById('loc-room');
  const selShelf = document.getElementById('loc-shelf');

  let locTree = [];  // arbre complet sites→rooms→shelves

  // ── Charger l'arbre et peupler les selects de premier niveau ─────────────
  async function loadLocations() {
    try {
      const res = await fetch('/api/locations/tree');
      locTree = await res.json();
      selSite.innerHTML = '<option value="">— Choisir —</option>' +
        locTree.map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
    } catch (e) { /* ignore */ }
  }

  function clearShelf() {
    selShelf.innerHTML = '<option value="">— Choisir —</option>';
    selShelf.disabled = true;
  }

  selSite.addEventListener('change', () => {
    const siteId = parseInt(selSite.value) || null;
    const site = locTree.find(s => s.id === siteId);
    selRoom.innerHTML = '<option value="">— Choisir —</option>';
    clearShelf();
    if (site && site.rooms.length) {
      selRoom.innerHTML += site.rooms.map(r => `<option value="${r.id}">${escHtml(r.name)}</option>`).join('');
      selRoom.disabled = false;
    } else {
      selRoom.disabled = true;
    }
    updateScanEnabled();
  });

  selRoom.addEventListener('change', () => {
    const siteId = parseInt(selSite.value) || null;
    const roomId = parseInt(selRoom.value) || null;
    const site   = locTree.find(s => s.id === siteId);
    const room   = site && site.rooms.find(r => r.id === roomId);
    selShelf.innerHTML = '<option value="">— Choisir —</option>';
    if (room && room.shelves && room.shelves.length) {
      selShelf.innerHTML += room.shelves.map(sh => `<option value="${sh.id}">${escHtml(sh.name)}</option>`).join('');
      selShelf.disabled = false;
    } else {
      selShelf.disabled = true;
    }
  });

  function resolveRoomId()     { return parseInt(selRoom.value)  || null; }
  function resolveLocationId() { return parseInt(selShelf.value) || null; }
  function hasLocation()       { return !!selSite.value; }

  const hintText = document.getElementById('scan-hint-text');

  function updateScanEnabled() {
    const ok = hasLocation();
    isbnInput.disabled = !ok;
    camBtn.disabled    = !ok;
    isbnInput.placeholder = ok ? 'Saisir un ISBN…' : 'Choisissez d\'abord une adresse';
    hintText.textContent  = ok
      ? 'Saisissez un ISBN ou utilisez la caméra'
      : 'Sélectionnez une adresse pour commencer';
    hintText.style.color = ok ? '' : 'var(--color-warning, #e08c00)';
  }

  // ── Scan ─────────────────────────────────────────────────────────────────
  let autoSubmitTimer = null;

  isbnInput.addEventListener('input', () => {
    if (!hasLocation()) return;
    clearTimeout(autoSubmitTimer);
    const val = isbnInput.value.replace(/\D/g, '');
    if (val.length >= 10 && val.length <= 14) {
      autoSubmitTimer = setTimeout(() => {
        const isbn = isbnInput.value.trim();
        if (isbn) submitScan(isbn);
      }, 80);
    }
  });

  isbnInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!hasLocation()) return;
      clearTimeout(autoSubmitTimer);
      const isbn = isbnInput.value.trim();
      if (isbn) submitScan(isbn);
    }
  });

  async function submitScan(isbn) {
    isbnInput.value = '';
    isbnInput.focus();

    const card = pendingCard(isbn);
    prependCard(card);

    const room_id     = resolveRoomId();
    const location_id = resolveLocationId();

    try {
      if (isBookBarcode(isbn)) {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isbn, room_id, location_id }),
        });
        const data = await res.json();
        if (data.status === 'exists') {
          replaceCard(card, existsCard(data.book));
        } else if (data.status === 'pending') {
          pollBook(data.book.id, card, isbn, 0, data.ean_warning);
        } else if (data.status === 'ok') {
          replaceCard(card, bookCard(data.book));
        }
      } else {
        const res = await fetch('/api/scan/music', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ barcode: isbn, room_id }),
        });
        const data = await res.json();
        if (data.status === 'exists') {
          replaceCard(card, discExistsCard(data.disc));
        } else if (data.status === 'pending') {
          pollDisc(data.disc.id, card, isbn, 0);
        }
      }
    } catch (err) {
      replaceCard(card, errorCard('Erreur réseau lors du scan.'));
    }
  }

  function discExistsCard(disc) {
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-warn slide-in';
    div.innerHTML = `
      <div class="card-cover-placeholder">💿</div>
      <div class="card-info">
        <div class="card-title">${escHtml(disc.title)}</div>
        <div class="card-authors">Déjà dans la médiathèque</div>
      </div>
      <div class="card-status card-status-warn">⚠ Existant</div>
    `;
    return div;
  }

  function discCard(disc) {
    const cover = disc.cover_url
      ? `<img src="${escHtml(disc.cover_url)}" alt="pochette" class="card-cover">`
      : `<div class="card-cover-placeholder">💿</div>`;
    const locBadge = disc.room_name
      ? `<span class="badge badge-shelf">${escHtml(disc.room_name)}</span>`
      : '';
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-ok slide-in';
    div.innerHTML = `
      ${cover}
      <div class="card-info">
        <div class="card-title">${escHtml(disc.title)}</div>
        ${disc.artist ? `<div class="card-authors">${escHtml(disc.artist)}</div>` : ''}
        ${locBadge ? `<div class="card-badges">${locBadge}</div>` : ''}
      </div>
      <div class="card-status card-status-ok">✓ Ajouté</div>
    `;
    return div;
  }

  function discNotFoundCard(barcode) {
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-error slide-in';
    div.innerHTML = `
      <div class="card-cover-placeholder">💿</div>
      <div class="card-info">
        <div class="card-title">${escHtml(barcode)}</div>
        <div class="card-authors">Introuvable en ligne</div>
      </div>
    `;
    return div;
  }

  async function pollDisc(discId, card, barcode, attempt = 0) {
    if (attempt > 20) { replaceCard(card, discNotFoundCard(barcode)); return; }
    await sleep(attempt === 0 ? 500 : 1000);
    try {
      const res = await fetch(`/api/music/${discId}`);
      const data = await res.json();
      if (data.enrichment_status === 'ok') {
        replaceCard(card, discCard(data));
      } else if (data.enrichment_status === 'not_found') {
        replaceCard(card, discNotFoundCard(barcode));
      } else {
        await pollDisc(discId, card, barcode, attempt + 1);
      }
    } catch { await pollDisc(discId, card, barcode, attempt + 1); }
  }

  // ── Polling ──────────────────────────────────────────────────────────────
  async function pollBook(bookId, card, isbn, attempt = 0, eanWarning = null) {
    if (attempt > 20) {
      replaceCard(card, notFoundCard(isbn, bookId));
      return;
    }
    await sleep(1500);
    try {
      const res = await fetch(`/api/scan/status/${bookId}`);
      const data = await res.json();
      if (data.enrichment_status === 'ok') {
        replaceCard(card, bookCard(data.book));
      } else if (data.enrichment_status === 'not_found') {
        replaceCard(card, notFoundCard(isbn, bookId, eanWarning));
      } else {
        await pollBook(bookId, card, isbn, attempt + 1, eanWarning);
      }
    } catch {
      await pollBook(bookId, card, isbn, attempt + 1);
    }
  }

  // ── Manual form ──────────────────────────────────────────────────────────
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-manual-isbn]');
    if (!btn) return;
    const isbn = btn.dataset.manualIsbn;
    manualIsbnDisplay.textContent = isbn;
    manualContainer.dataset.bookId = btn.dataset.bookId || '';
    manualContainer.style.display = 'block';
    manualContainer.scrollIntoView({ behavior: 'smooth' });
    document.getElementById('manual-title').focus();
  });

  manualForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const isbn = manualIsbnDisplay.textContent.trim();
    const bookId = manualContainer.dataset.bookId;
    const title = document.getElementById('manual-title').value.trim();
    const authorsRaw = document.getElementById('manual-authors').value.trim();
    const authors = authorsRaw ? authorsRaw.split(',').map(a => a.trim()).filter(Boolean) : [];

    try {
      const method = bookId ? 'PATCH' : 'POST';
      const url = bookId ? `/api/books/${bookId}` : '/api/books';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isbn: isbn || null, title, authors, room_id: resolveRoomId(), location_id: resolveLocationId(), source: 'manual', enrichment_status: 'ok' }),
      });
      if (res.ok) {
        const book = await res.json();
        manualContainer.style.display = 'none';
        manualForm.reset();
        const old = feed.querySelector(`[data-book-id="${bookId}"]`);
        if (old) old.replaceWith(bookCard(book));
        else prependCard(bookCard(book));
        isbnInput.focus();
      } else {
        const err = await res.json();
        alert(err.detail || 'Erreur lors de la création.');
      }
    } catch (err) {
      alert('Erreur réseau.');
    }
  });

  manualCancel.addEventListener('click', () => {
    manualContainer.style.display = 'none';
    manualForm.reset();
    isbnInput.focus();
  });

  // ── Card builders ────────────────────────────────────────────────────────
  function bookCard(book) {
    const authors = Array.isArray(book.authors) ? book.authors.join(', ') : '';
    const cover = book.cover_url
      ? `<img src="${escHtml(book.cover_url)}" alt="couverture" class="card-cover" onerror="this.src='/static/img/no-cover.svg'">`
      : `<img src="/static/img/no-cover.svg" alt="couverture" class="card-cover">`;
    const seriesBadge = book.series_name
      ? `<span class="badge badge-series">${escHtml(book.series_name)}${book.series_position ? ' #' + book.series_position : ''}</span>`
      : '';
    const locBadge = book.location
      ? `<span class="badge badge-shelf">${escHtml(book.location.label)}</span>`
      : '';
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-ok slide-in';
    div.dataset.bookId = book.id;
    div.style.cursor = 'pointer';
    div.innerHTML = `
      ${cover}
      <div class="card-info">
        <div class="card-title">${escHtml(book.title)}</div>
        ${authors ? `<div class="card-authors">${escHtml(authors)}</div>` : ''}
        ${book.publisher ? `<div class="card-authors" style="color:var(--color-text-muted)">${escHtml(book.publisher)}</div>` : ''}
        <div class="card-badges">${seriesBadge}${locBadge}</div>
      </div>
      <div class="card-status card-status-ok">✓ Ajouté</div>
    `;
    div.addEventListener('click', () => window.openBookModal?.(book.id));
    return div;
  }

  function pendingCard(isbn) {
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-pending slide-in';
    div.innerHTML = `
      <div class="card-cover-placeholder"><span class="scan-spinner"></span></div>
      <div class="card-info">
        <div class="card-title card-title-muted">${escHtml(isbn)}</div>
        <div class="card-authors">Recherche en cours…</div>
      </div>
      <div class="card-status card-status-pending">⏳</div>
    `;
    return div;
  }

  function notFoundCard(isbn, bookId, eanWarning = null) {
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-error slide-in';
    div.dataset.bookId = bookId;
    const warningHtml = eanWarning
      ? `<div class="card-ean-warning">⚠ ${escHtml(eanWarning)}</div>`
      : '';
    div.innerHTML = `
      <img src="/static/img/no-cover.svg" alt="" class="card-cover">
      <div class="card-info">
        <div class="card-title">${escHtml(isbn)}</div>
        <div class="card-authors">Introuvable en ligne</div>
        ${warningHtml}
      </div>
      <button class="btn btn-sm btn-ghost" data-manual-isbn="${escHtml(isbn)}" data-book-id="${bookId}">
        Saisir manuellement
      </button>
    `;
    return div;
  }

  function existsCard(book) {
    const authors = Array.isArray(book.authors) ? book.authors.join(', ') : '';
    const cover = book.cover_url
      ? `<img src="${escHtml(book.cover_url)}" alt="couverture" class="card-cover" onerror="this.src='/static/img/no-cover.svg'">`
      : `<img src="/static/img/no-cover.svg" alt="couverture" class="card-cover">`;
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-warn slide-in';
    div.style.cursor = 'pointer';
    div.innerHTML = `
      ${cover}
      <div class="card-info">
        <div class="card-title">${escHtml(book.title)}</div>
        ${authors ? `<div class="card-authors">${escHtml(authors)}</div>` : ''}
        ${book.publisher ? `<div class="card-authors" style="color:var(--color-text-muted)">${escHtml(book.publisher)}</div>` : ''}
        <div class="card-authors" style="color:var(--color-warn,#e07b00)">Déjà dans la bibliothèque</div>
      </div>
      <div class="card-status card-status-warn">⚠</div>
    `;
    div.addEventListener('click', () => window.openBookModal?.(book.id));
    return div;
  }

  function errorCard(msg) {
    const div = document.createElement('div');
    div.className = 'scan-card scan-card-error slide-in';
    div.innerHTML = `<div class="card-info"><div class="card-title">${escHtml(msg)}</div></div>`;
    return div;
  }

  function prependCard(el) { feed.insertBefore(el, feed.firstChild); }
  function replaceCard(old, next) {
    if (old.parentNode) old.parentNode.replaceChild(next, old);
    else prependCard(next);
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ── Caméra ───────────────────────────────────────────────────────────────
  const camOverlay   = document.getElementById('cam-overlay');
  const camVideo     = document.getElementById('cam-video');
  const camBtn       = document.getElementById('cam-btn');
  const camClose     = document.getElementById('cam-close');
  const camTorch     = document.getElementById('cam-torch');
  const camFileInput = document.getElementById('cam-file-input');
  let torchOn = false;

  let lastScanned   = null;
  let lastScannedAt = 0;
  const DEBOUNCE_MS = 3000;
  let scanPaused    = false;

  // Compteur de répétitions pour les codes non-ISBN (évite les faux positifs sur packaging)
  let _pendingCode  = null;
  let _pendingCount = 0;
  const MUSIC_CONFIRM_COUNT = 3;

  function isValidBarcode(code) {
    if (code.length === 13) {
      const sum = code.split('').slice(0, 12).reduce((s, d, i) => s + parseInt(d) * (i % 2 === 0 ? 1 : 3), 0);
      return (10 - sum % 10) % 10 === parseInt(code[12]);
    }
    if (code.length === 10) {
      const sum = code.split('').slice(0, 9).reduce((s, d, i) => s + parseInt(d) * (10 - i), 0);
      const check = (11 - sum % 11) % 11;
      return check === (code[9] === 'X' ? 10 : parseInt(code[9]));
    }
    return false;
  }

  function isBookBarcode(code) {
    return code.startsWith('978') || code.startsWith('979') || code.length === 10;
  }

  // ── Charger Quagga2 à la demande ─────────────────────────────────────────
  function loadQuagga() {
    if (window.Quagga) return Promise.resolve(window.Quagga);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '/static/js/quagga2.min.js';
      s.onload  = () => resolve(window.Quagga);
      s.onerror = () => reject(new Error('Quagga non chargé'));
      document.head.appendChild(s);
    });
  }

  // ── Scan live continu ─────────────────────────────────────────────────────
  let liveActive = false;

  async function startLive() {
    try { await loadQuagga(); } catch { fallbackFileCapture(); return; }

    camOverlay.style.display = 'flex';
    camOverlay.removeAttribute('aria-hidden');
    document.body.style.overflow = 'hidden';
    document.getElementById('cam-live-feed').innerHTML = '';

    Quagga.init({
      inputStream: {
        type: 'LiveStream',
        target: document.getElementById('quagga-viewport'),
        constraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 480 } },
        area: { top: '25%', right: '11%', left: '11%', bottom: '25%' },
      },
      decoder: { readers: ['ean_reader'] },
      locator: { patchSize: 'medium', halfSample: true },
      locate: true,
      frequency: 20,
    }, err => {
      if (err) {
        stopCamera();
        fallbackFileCapture();
        return;
      }
      liveActive = true;
      Quagga.start();

      // Vérifier si le torch est supporté sur ce device
      const track = Quagga.CameraAccess.getActiveTrack();
      if (track) {
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) {
          camTorch.style.display = 'block';
          torchOn = false;
          camTorch.classList.remove('cam-torch-on');
        }
      }
    });

    Quagga.onDetected(onBarcodeDetected);
  }

  function dismissToast(toast, delayMs) {
    setTimeout(() => {
      toast.style.transition = 'opacity .4s';
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 420);
    }, delayMs);
  }

  function isBarcodeInFrame(result) {
    // result.box est en coordonnées canvas (pixels flux vidéo), pas CSS.
    const box = result.box;
    if (!box || !box.length) return true;
    const canvas = Quagga.canvas?.dom?.image;
    const W = canvas?.width;
    const H = canvas?.height;
    if (!W || !H) return true;
    const cx = box.reduce((s, p) => s + p[0], 0) / box.length;
    const cy = box.reduce((s, p) => s + p[1], 0) / box.length;
    // Marges identiques à area: left/right 11%, top/bottom 25%
    return cx >= W * 0.11 && cx <= W * 0.89 && cy >= H * 0.25 && cy <= H * 0.75;
  }

  function onBarcodeDetected(result) {
    if (scanPaused) return;
    if (!isBarcodeInFrame(result)) return;
    const raw = (result.codeResult.code || '').replace(/\D/g, '');
    if (!raw || (raw.length !== 13 && raw.length !== 10)) return;
    if (!isValidBarcode(raw)) return;
    const now = Date.now();
    if (raw === lastScanned && now - lastScannedAt < DEBOUNCE_MS) return;

    // Les codes non-ISBN doivent être détectés MUSIC_CONFIRM_COUNT fois de suite
    if (!isBookBarcode(raw)) {
      if (_pendingCode === raw) {
        _pendingCount++;
      } else {
        _pendingCode = raw;
        _pendingCount = 1;
      }
      if (_pendingCount < MUSIC_CONFIRM_COUNT) return;
      _pendingCode = null; _pendingCount = 0;
    }

    lastScanned = raw; lastScannedAt = now;

    // Pause de 2s pour laisser le temps de voir le résultat
    scanPaused = true;
    setTimeout(() => { scanPaused = false; }, 1000);

    // Vibration (Android) + bip sonore (iOS/Safari)
    if (navigator.vibrate) navigator.vibrate(240);
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 1800;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.08);
    } catch (_) {}

    // Feedback visuel immédiat dans le mini-feed
    const feed = document.getElementById('cam-live-feed');
    const toast = document.createElement('div');
    toast.className = 'cam-toast cam-toast-pending';
    toast.innerHTML = `<span class="cam-toast-spinner"></span><span>${raw}</span>`;
    feed.insertBefore(toast, feed.firstChild);

    // Recherche en arrière-plan — caméra reste ouverte
    const room_id     = resolveRoomId();
    const location_id = resolveLocationId();

    if (isBookBarcode(raw)) {
      fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isbn: raw, room_id, location_id }),
      }).then(async r => {
        if (!r.ok) {
          let detail = `HTTP ${r.status}`;
          try { const d = await r.json(); detail = d.detail || detail; } catch (_) {}
          if (r.status === 401) { window.location.href = '/login'; return; }
          throw new Error(detail);
        }
        return r.json();
      }).then(data => {
        if (!data) return;
        if (data.status === 'exists') {
          toast.className = 'cam-toast cam-toast-warn';
          toast.innerHTML = `⚠ <strong>${escHtml(data.book.title)}</strong> <span>déjà dans la bibliothèque</span>`;
          dismissToast(toast, 2000);
        } else {
          toast.className = 'cam-toast cam-toast-ok';
          toast.innerHTML = `✓ <strong>${escHtml(data.book.title || raw)}</strong>`;
          if (data.status === 'pending') pollToast(toast, data.book.id, raw);
          else dismissToast(toast, 2000);
        }
      }).catch(err => {
        toast.className = 'cam-toast cam-toast-err';
        toast.innerHTML = `✗ ${escHtml(err.message || 'Erreur')} — ${raw}`;
        dismissToast(toast, 3000);
      });
    } else {
      fetch('/api/scan/music', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ barcode: raw, room_id }),
      }).then(async r => {
        if (!r.ok) {
          let detail = `HTTP ${r.status}`;
          try { const d = await r.json(); detail = d.detail || detail; } catch (_) {}
          if (r.status === 401) { window.location.href = '/login'; return; }
          throw new Error(detail);
        }
        return r.json();
      }).then(data => {
        if (!data) return;
        if (data.status === 'exists') {
          toast.className = 'cam-toast cam-toast-warn';
          toast.innerHTML = `⚠ 💿 <strong>${escHtml(data.disc.title)}</strong> <span>déjà dans la médiathèque</span>`;
          dismissToast(toast, 2500);
        } else {
          toast.className = 'cam-toast cam-toast-ok';
          toast.innerHTML = `💿 <strong>${escHtml(data.disc.title || raw)}</strong>`;
          if (data.status === 'pending') pollMusicToast(toast, data.disc.id, raw);
          else dismissToast(toast, 2500);
        }
      }).catch(err => {
        toast.className = 'cam-toast cam-toast-err';
        toast.innerHTML = `✗ ${escHtml(err.message || 'Erreur')} — ${raw}`;
        dismissToast(toast, 3000);
      });
    }
  }

  async function pollToast(toast, bookId, isbn, attempt = 0) {
    if (attempt > 20) {
      toast.className = 'cam-toast cam-toast-warn';
      toast.innerHTML = `? <strong>${escHtml(isbn)}</strong> <span>introuvable</span>`;
      // ajouter une carte d'erreur dans le feed principal
      const old = feed.querySelector(`[data-book-id="${bookId}"]`);
      if (!old) prependCard(notFoundCard(isbn, bookId));
      return;
    }
    await new Promise(r => setTimeout(r, attempt === 0 ? 500 : 1000));
    try {
      const res = await fetch(`/api/scan/status/${bookId}`);
      const data = await res.json();
      if (data.enrichment_status === 'ok') {
        toast.className = 'cam-toast cam-toast-ok';
        toast.innerHTML = `✓ <strong>${escHtml(data.book.title)}</strong>`;
        dismissToast(toast, 2000);
        // créer/mettre à jour la carte dans le feed principal
        const old = feed.querySelector(`[data-book-id="${bookId}"]`);
        if (old) old.replaceWith(bookCard(data.book));
        else prependCard(bookCard(data.book));
      } else if (data.enrichment_status === 'not_found') {
        toast.className = 'cam-toast cam-toast-warn';
        toast.innerHTML = `? <strong>${escHtml(isbn)}</strong> <span>introuvable</span>`;
        dismissToast(toast, 2000);
        const old = feed.querySelector(`[data-book-id="${bookId}"]`);
        if (!old) prependCard(notFoundCard(isbn, bookId));
      } else {
        pollToast(toast, bookId, isbn, attempt + 1);
      }
    } catch { pollToast(toast, bookId, isbn, attempt + 1); }
  }

  async function pollMusicToast(toast, discId, barcode, attempt = 0) {
    if (attempt > 20) {
      toast.className = 'cam-toast cam-toast-warn';
      toast.innerHTML = `💿 <strong>${barcode}</strong> <span>introuvable</span>`;
      dismissToast(toast, 2500);
      return;
    }
    await new Promise(r => setTimeout(r, attempt === 0 ? 500 : 1000));
    try {
      const res = await fetch(`/api/music/${discId}`);
      const data = await res.json();
      if (data.enrichment_status === 'ok') {
        toast.className = 'cam-toast cam-toast-ok';
        toast.innerHTML = `💿 <strong>${escHtml(data.title)}</strong>${data.artist ? ' <span>— ' + escHtml(data.artist) + '</span>' : ''}`;
        dismissToast(toast, 2500);
      } else if (data.enrichment_status === 'not_found') {
        toast.className = 'cam-toast cam-toast-warn';
        toast.innerHTML = `💿 <strong>${barcode}</strong> <span>introuvable</span>`;
        dismissToast(toast, 2500);
      } else {
        await pollMusicToast(toast, discId, barcode, attempt + 1);
      }
    } catch { await pollMusicToast(toast, discId, barcode, attempt + 1); }
  }

  function stopCamera() {
    if (liveActive) { try { Quagga.offDetected(onBarcodeDetected); Quagga.stop(); } catch(_){} liveActive = false; }
    camOverlay.style.display = 'none';
    camOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    // Verser les toasts dans le feed principal
    const liveFeed = document.getElementById('cam-live-feed');
    const cards = Array.from(liveFeed.querySelectorAll('.cam-toast'));
    cards.reverse().forEach(t => {
      const div = document.createElement('div');
      div.className = 'scan-card slide-in ' +
        (t.classList.contains('cam-toast-ok') ? 'scan-card-ok' : t.classList.contains('cam-toast-warn') ? 'scan-card-warn' : 'scan-card-pending');
      div.innerHTML = `<div class="card-info">${t.innerHTML}</div>`;
      prependCard(div);
    });
    isbnInput.focus();
  }

  // ── Fallback photo (HTTP / navigateur sans getUserMedia) ──────────────────
  function fallbackFileCapture() { camFileInput.click(); }

  camFileInput.addEventListener('change', async () => {
    const file = camFileInput.files[0];
    camFileInput.value = '';
    if (!file) return;

    camBtn.disabled = true;
    const origHTML = camBtn.innerHTML;
    camBtn.textContent = '⏳';

    try { await loadQuagga(); } catch {
      camBtn.disabled = false; camBtn.innerHTML = origHTML;
      alert("Module de scan non disponible.");
      return;
    }

    const url = URL.createObjectURL(file);
    const img  = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    URL.revokeObjectURL(url);

    const MAX = 1000;
    const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width  = Math.round(img.naturalWidth  * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

    const found = await new Promise(resolve => {
      Quagga.decodeSingle({
        decoder: { readers: ['ean_reader', 'ean_8_reader', 'upc_reader'] },
        locate: true,
        locator: { patchSize: 'medium', halfSample: false },
        src: dataUrl,
      }, r => resolve(r && r.codeResult ? r.codeResult.code : null));
    });

    camBtn.disabled = false; camBtn.innerHTML = origHTML;

    if (found) {
      const raw = found.replace(/\D/g, '');
      if (raw.length === 13 || raw.length === 10) { submitScan(raw); return; }
    }
    alert("Aucun code-barres détecté. Cadrez bien le code-barres et recommencez.");
  });

  // ── Bouton caméra ─────────────────────────────────────────────────────────
  camTorch.addEventListener('click', async () => {
    const track = Quagga.CameraAccess.getActiveTrack();
    if (!track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      camTorch.classList.toggle('cam-torch-on', torchOn);
      camTorch.title = torchOn ? 'Éteindre le flash' : 'Flash';
    } catch (e) {
      torchOn = !torchOn; // rollback
    }
  });

  camBtn.addEventListener('click', startLive);
  camClose.addEventListener('click', () => {
    torchOn = false;
    camTorch.style.display = 'none';
    camTorch.classList.remove('cam-torch-on');
    stopCamera();
  });
  camOverlay.addEventListener('click', (e) => { if (e.target === camOverlay) stopCamera(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && liveActive) stopCamera(); });

  // ── BarcodeDetector natif ─────────────────────────────────────────────────
  const nativeCamBtn     = document.getElementById('native-cam-btn');
  const nativeCamOverlay = document.getElementById('native-cam-overlay');
  const nativeCamClose   = document.getElementById('native-cam-close');
  const nativeCamVideo   = document.getElementById('native-cam-video');
  const nativeCamFeed    = document.getElementById('native-cam-feed');
  let nativeStream       = null;
  let nativeRafId        = null;
  let nativeActive       = false;
  let nativeLastScanned  = null;
  let nativeLastAt       = 0;

  if ('BarcodeDetector' in window) {
    nativeCamBtn.style.display = '';
  }

  async function startNative() {
    if (!('BarcodeDetector' in window)) return;
    nativeCamOverlay.style.display = 'flex';
    nativeCamOverlay.removeAttribute('aria-hidden');
    document.body.style.overflow = 'hidden';
    nativeCamFeed.innerHTML = '';

    try {
      nativeStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 },
                 focusMode: 'continuous' },
      });
      nativeCamVideo.srcObject = nativeStream;
      await nativeCamVideo.play();
    } catch {
      stopNative();
      return;
    }

    const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
    nativeActive = true;

    async function tick() {
      if (!nativeActive) return;
      try {
        const barcodes = await detector.detect(nativeCamVideo);
        for (const bc of barcodes) {
          const raw = bc.rawValue.replace(/\D/g, '');
          if (!raw || (raw.length !== 13 && raw.length !== 10)) continue;
          if (!isValidBarcode(raw)) continue;
          const now = Date.now();
          if (raw === nativeLastScanned && now - nativeLastAt < DEBOUNCE_MS) continue;

          if (!isBookBarcode(raw)) {
            if (_pendingCode === raw) { _pendingCount++; }
            else { _pendingCode = raw; _pendingCount = 1; }
            if (_pendingCount < MUSIC_CONFIRM_COUNT) continue;
            _pendingCode = null; _pendingCount = 0;
          }

          nativeLastScanned = raw; nativeLastAt = Date.now();
          if (navigator.vibrate) navigator.vibrate(240);

          const toast = document.createElement('div');
          toast.className = 'cam-toast cam-toast-pending';
          toast.innerHTML = `<span class="cam-toast-spinner"></span><span>${raw}</span>`;
          nativeCamFeed.insertBefore(toast, nativeCamFeed.firstChild);

          const room_id = resolveRoomId();
          const location_id = resolveLocationId();

          if (isBookBarcode(raw)) {
            fetch('/api/scan', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ isbn: raw, room_id, location_id }),
            }).then(async r => {
              if (!r.ok) {
                let detail = `HTTP ${r.status}`;
                try { const d = await r.json(); detail = d.detail || detail; } catch (_) {}
                if (r.status === 401) { window.location.href = '/login'; return; }
                throw new Error(detail);
              }
              return r.json();
            }).then(data => {
              if (!data) return;
              if (data.status === 'exists') {
                toast.className = 'cam-toast cam-toast-warn';
                toast.innerHTML = `⚠ Déjà scanné — <strong>${escHtml(data.book?.title || raw)}</strong>`;
                dismissToast(toast, 3000);
                const existing = feed.querySelector(`[data-book-id="${data.book?.id}"]`);
                if (!existing) prependCard(bookCard(data.book));
              } else if (data.status === 'pending') {
                pollToast(toast, data.book.id, raw);
              }
            }).catch(err => {
              toast.innerHTML = `✗ ${escHtml(err.message || 'Erreur')} — ${raw}`;
              toast.className = 'cam-toast cam-toast-error';
              dismissToast(toast, 4000);
            });
          }
          break;
        }
      } catch (_) {}
      nativeRafId = requestAnimationFrame(tick);
    }
    nativeRafId = requestAnimationFrame(tick);
  }

  function stopNative() {
    nativeActive = false;
    if (nativeRafId) { cancelAnimationFrame(nativeRafId); nativeRafId = null; }
    if (nativeStream) { nativeStream.getTracks().forEach(t => t.stop()); nativeStream = null; }
    nativeCamVideo.srcObject = null;
    nativeCamOverlay.style.display = 'none';
    nativeCamOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  nativeCamBtn.addEventListener('click', startNative);
  nativeCamClose.addEventListener('click', stopNative);
  nativeCamOverlay.addEventListener('click', (e) => { if (e.target === nativeCamOverlay) stopNative(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && nativeActive) stopNative(); });

  // ── ZXing ─────────────────────────────────────────────────────────────────
  const zxingCamBtn     = document.getElementById('zxing-cam-btn');
  const zxingCamOverlay = document.getElementById('zxing-cam-overlay');
  const zxingCamClose   = document.getElementById('zxing-cam-close');
  const zxingCamVideo   = document.getElementById('zxing-cam-video');
  const zxingCamFeed    = document.getElementById('zxing-cam-feed');
  let zxingReader       = null;
  let zxingActive       = false;
  let zxingLastScanned  = null;
  let zxingLastAt       = 0;

  function loadZXing() {
    if (window.ZXingBrowser) return Promise.resolve(window.ZXingBrowser);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = '/static/js/zxing-browser.min.js';
      s.onload  = () => resolve(window.ZXingBrowser);
      s.onerror = () => reject(new Error('ZXing non chargé'));
      document.head.appendChild(s);
    });
  }

  async function startZXing() {
    zxingCamOverlay.style.display = 'flex';
    zxingCamOverlay.removeAttribute('aria-hidden');
    document.body.style.overflow = 'hidden';
    zxingCamFeed.innerHTML = '';

    try { await loadZXing(); } catch { stopZXing(); return; }

    zxingActive = true;
    zxingReader = new ZXingBrowser.BrowserMultiFormatReader();

    try {
      await zxingReader.decodeFromVideoDevice(null, zxingCamVideo, (result, err) => {
        if (!result || !zxingActive) return;
        const raw = result.getText().replace(/\D/g, '');
        if (!raw || (raw.length !== 13 && raw.length !== 10)) return;
        if (!isValidBarcode(raw)) return;
        const now = Date.now();
        if (raw === zxingLastScanned && now - zxingLastAt < DEBOUNCE_MS) return;

        if (!isBookBarcode(raw)) {
          if (_pendingCode === raw) { _pendingCount++; }
          else { _pendingCode = raw; _pendingCount = 1; }
          if (_pendingCount < MUSIC_CONFIRM_COUNT) return;
          _pendingCode = null; _pendingCount = 0;
        }

        zxingLastScanned = raw; zxingLastAt = Date.now();
        if (navigator.vibrate) navigator.vibrate(240);

        const toast = document.createElement('div');
        toast.className = 'cam-toast cam-toast-pending';
        toast.innerHTML = `<span class="cam-toast-spinner"></span><span>${raw}</span>`;
        zxingCamFeed.insertBefore(toast, zxingCamFeed.firstChild);

        const room_id = resolveRoomId();
        const location_id = resolveLocationId();

        if (isBookBarcode(raw)) {
          fetch('/api/scan', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isbn: raw, room_id, location_id }),
          }).then(async r => {
            if (!r.ok) {
              let detail = `HTTP ${r.status}`;
              try { const d = await r.json(); detail = d.detail || detail; } catch (_) {}
              if (r.status === 401) { window.location.href = '/login'; return; }
              throw new Error(detail);
            }
            return r.json();
          }).then(data => {
            if (!data) return;
            if (data.status === 'exists') {
              toast.className = 'cam-toast cam-toast-warn';
              toast.innerHTML = `⚠ Déjà scanné — <strong>${escHtml(data.book?.title || raw)}</strong>`;
              dismissToast(toast, 3000);
              const existing = feed.querySelector(`[data-book-id="${data.book?.id}"]`);
              if (!existing) prependCard(bookCard(data.book));
            } else if (data.status === 'pending') {
              pollToast(toast, data.book.id, raw);
            }
          }).catch(err => {
            toast.innerHTML = `✗ ${escHtml(err.message || 'Erreur')} — ${raw}`;
            toast.className = 'cam-toast cam-toast-error';
            dismissToast(toast, 4000);
          });
        }
      });
    } catch { stopZXing(); }
  }

  function stopZXing() {
    zxingActive = false;
    try { zxingReader?.reset(); } catch (_) {}
    zxingReader = null;
    zxingCamVideo.srcObject = null;
    zxingCamOverlay.style.display = 'none';
    zxingCamOverlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  zxingCamBtn.addEventListener('click', startZXing);
  zxingCamClose.addEventListener('click', stopZXing);
  zxingCamOverlay.addEventListener('click', (e) => { if (e.target === zxingCamOverlay) stopZXing(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && zxingActive) stopZXing(); });

  // ── Init ─────────────────────────────────────────────────────────────────
  updateScanEnabled();
  loadLocations();
  isbnInput.focus();
})();
</script>
