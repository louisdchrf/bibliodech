<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bibliodech{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function(){
      try {
        if (localStorage.getItem('bib_dark') === '1') document.documentElement.classList.add('dark');
      } catch(e){}
    })();
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="/scanner" class="nav-logo"><span style="line-height:1">📚</span> Bibliodech</a>
    <div class="nav-links">
      <a href="/scanner" {% if active=='scanner' %}class="active"{% endif %}>Scanner</a>
      <a href="/library" {% if active=='library' %}class="active"{% endif %}>Bibliothèque</a>
      <a href="/series" {% if active=='series' %}class="active"{% endif %}>Séries</a>
      <a href="/locations" {% if active=='locations' %}class="active"{% endif %}>Localisations</a>
      <a href="/loans" {% if active=='loans' %}class="active"{% endif %}>Prêts</a>
      <a href="/missing" {% if active=='missing' %}class="active"{% endif %}>À compléter</a>
      <a href="/stats" {% if active=='stats' %}class="active"{% endif %}>Statistiques</a>
      {% if user.role == 'admin' %}<a href="/settings" {% if active=='settings' or active=='users' %}class="active"{% endif %}>Paramètres</a>{% endif %}
    </div>
    <div class="nav-user">
      <span class="nav-username">{{ user.username }}</span>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="btn btn-ghost btn-sm">Déconnexion</button>
      </form>
    </div>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </nav>
  <script>
    (function(){
      var btn = document.getElementById('nav-hamburger');
      var links = document.querySelector('.nav-links');
      if (!btn || !links) return;
      btn.addEventListener('click', function(){
        var open = links.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
      });
      document.addEventListener('click', function(e){
        if (!btn.contains(e.target) && !links.contains(e.target)) {
          links.classList.remove('open');
          btn.setAttribute('aria-expanded', false);
        }
      });
    })();
  </script>

  {% if flash %}
  <div class="flash flash-{{ flash.type }}">{{ flash.message }}</div>
  {% endif %}

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    v{{ build_version }}
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
