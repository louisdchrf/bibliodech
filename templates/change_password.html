{% extends "base.html" %}
{% block title %}Changer de mot de passe – Bibliodech{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">📚 Bibliodech</h1>
    <p style="text-align:center;color:var(--color-text-muted);margin-bottom:1.5rem">
      Vous devez choisir un nouveau mot de passe avant de continuer.
    </p>
    <form id="change-pw-form">
      <div class="field">
        <label for="new_password">Nouveau mot de passe</label>
        <input type="password" id="new_password" name="new_password" required minlength="6"
               autocomplete="new-password" placeholder="Au moins 6 caractères">
      </div>
      <div class="field">
        <label for="confirm_password">Confirmer le mot de passe</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
               autocomplete="new-password" placeholder="Répétez le mot de passe">
      </div>
      <div id="change-msg" class="edit-msg" style="margin-bottom:.5rem"></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Enregistrer</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('change-pw-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('new_password').value;
  const confirm = document.getElementById('confirm_password').value;
  const msg = document.getElementById('change-msg');
  if (pw !== confirm) {
    msg.textContent = 'Les mots de passe ne correspondent pas.';
    msg.className = 'edit-msg edit-msg-err';
    return;
  }
  const res = await fetch('/api/me/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ new_password: pw }),
  });
  if (res.ok) {
    window.location.href = '/scanner';
  } else {
    const err = await res.json();
    msg.textContent = err.detail || 'Erreur.';
    msg.className = 'edit-msg edit-msg-err';
  }
});
</script>
{% endblock %}
