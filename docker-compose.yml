services:
  bibliodech:
    build: .
    container_name: bibliodech
    ports:
      - "8000:8000"
    volumes:
      - bibliodech_data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/bibliodech.db
      # SECRET_KEY : si absent, une clé aléatoire est générée et persistée en base au premier démarrage
      # SECRET_KEY: votre-cle-secrete-ici
      ADMIN_USERNAME: admin
      # ADMIN_PASSWORD : si absent, un mot de passe aléatoire est généré et affiché dans les logs
      # ADMIN_PASSWORD: votre-mot-de-passe-ici
      BUILD_VERSION: "${BUILD_VERSION:-dev}"
    restart: unless-stopped

volumes:
  bibliodech_data:
